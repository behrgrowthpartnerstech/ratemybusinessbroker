    realName:"(private)", tier:p.tier, role:p.role, joined:String(p.created_at).slice(0,10),
    onboarded: !!p.username, is_admin:p.is_admin });

  async function pageAll(table, cols, filter){
    const out=[]; let from=0;
    for(;;){
      let q=sb.from(table).select(cols).range(from, from+999);
      if(filter) q=filter(q);
      const {data,error}=await q;
      if(error) throw error;
      out.push(...(data||[]));
      if(!data||data.length<1000) break;
      from+=1000;
    }
    return out;
  }

  window.liveInit = async function(){
    try{
      const brokers = await pageAll("brokers","id,slug,name,firm,city,state,specialty,photo,website,source,rank_pin");
      BROKERS = brokers.map(brokerRow);
      const profs = await pageAll("profiles","id,username,role,tier,is_admin,created_at");
      USERS = profs.map(profRow);
      const revs = await pageAll("reviews","id,broker_id,author_id,ratings,text,ctx,stage,status,created_at,reviewer_role",
        q=>q.eq("status","published"));
      REVIEWS = revs.map(reviewRow).filter(r=>r.broker);
      const votes = await pageAll("review_votes","review_id,voter_id");
      const counts={};
      votes.forEach(v=>counts[v.review_id]=(counts[v.review_id]||0)+1);
      REVIEWS.forEach(r=>r.helpful=counts[r.id]||0);
      const { data:{ session: s } } = await sb.auth.getSession();
      if (s) await liveSignedIn(s.user);
      sb.auth.onAuthStateChange(async (ev, s2)=>{
        if(ev==="SIGNED_IN" && s2 && (!session||session.userId!==s2.user.id)) { await liveSignedIn(s2.user); render(); }
        if(ev==="SIGNED_OUT"){ session=null; adminMode=false; render(); }
      });
    }catch(e){ die(e); }
    render();
  };

  async function liveSignedIn(user){
    try{
      let { data:p, error } = await sb.from("profiles").select("id,username,role,tier,is_admin,created_at").eq("id",user.id).maybeSingle();
      if(error) throw error;
      if(!p){ // trigger not fired yet — create
        const ins = await sb.from("profiles").insert({id:user.id}).select().single();
        p = ins.data;
      }
      const u = profRow(p);
      const i = USERS.findIndex(x=>x.id===u.id);
      if(i>=0) USERS[i]=u; else USERS.push(u);
      session={userId:u.id};
      adminMode=!!p.is_admin;
      // personal state
      const w = await sb.from("watchlists").select("broker_id");
      watchlist = new Set((w.data||[]).map(x=>(BROKERS.find(b=>b.dbId===x.broker_id)||{}).slug).filter(Boolean));
      const pv = await sb.from("review_votes").select("review_id").eq("voter_id",u.id);
      helpfulVotes = new Set((pv.data||[]).map(x=>x.review_id));
      const pp = await sb.from("personal_prefs").select("pair_key,winner");
      personalTB = {}; (pp.data||[]).forEach(x=>personalTB[x.pair_key]=x.winner);
      myReviews = REVIEWS.filter(r=>r.user===u.id);
      if(adminMode) await liveLoadAdmin();
      if(!u.onboarded && location.hash!=="#/onboarding") location.hash="#/onboarding";
    }catch(e){ die(e); }
  }

  async function liveLoadAdmin(){
    try{
      const reps = await pageAll("reports","id,review_id,reporter_id,reason,detail,status,created_at");
      REPORTS = reps.map(x=>({ id:x.id, type:"user-report", reviewId:x.review_id,
        reason:x.reason, by:(USERS.find(u=>u.id===x.reporter_id)||{}).username||"member",
        date:String(x.created_at).slice(0,10), detail:x.detail, status:x.status }));
      const sugs = await pageAll("listing_requests","id,name,firm,location,info,requested_by,status,created_at");
      suggestions = sugs.map(x=>({ id:x.id, name:x.name, firm:x.firm, loc:x.location, info:x.info,
        by:(USERS.find(u=>u.id===x.requested_by)||{}).username||"member",
        date:String(x.created_at).slice(0,10), status:x.status }));
      const vr = await pageAll("verification_requests","id,user_id,kind,status,created_at",
        q=>q.eq("status","pending"));
      window._verifRequests = vr;
    }catch(e){ die(e); }
  }

  /* ---------- AUTH: email magic link ---------- */
  openAuth = function(goAfter){
    postAuthGo = goAfter || null;
    openModal(`
      <h3>Sign in or create account</h3>
      <p class="note" style="margin-top:2px">We'll email you a one-time sign-in link — no password to remember. Your name stays private; only your username is ever shown.</p>
      <label class="fl">Email</label><input class="fi" id="authEmail" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendMagicLink()">
      <button class="btn" style="width:100%;margin-top:16px" onclick="sendMagicLink()">Email me a sign-in link</button>
      <div class="banner" id="authBanner" style="display:none"></div>`);
  };
  window.sendMagicLink = async function(){
    const em=($("authEmail").value||"").trim();
    if(!em.includes("@")){ toast("Enter your email address"); return; }
    try{
      const { error } = await sb.auth.signInWithOtp({ email:em,
        options:{ emailRedirectTo: location.origin + location.pathname } });
      if(error) throw error;
      const el=$("authBanner"); el.style.display="block"; el.className="banner ok";
      el.textContent="Link sent — check "+em+" (and spam) and click it to sign in.";
    }catch(e){ die(e); }
  };
  signOut = async function(){ try{ await sb.auth.signOut(); }catch(e){} session=null; adminMode=false; location.hash="#/"; render(); toast("Signed out"); };

  /* ---------- onboarding saves to profile ---------- */
  finishOnboarding = async function(){
    const u=me(); if(!u) return;
    const h=($("ob_handle").value||"").trim().replace(/[^A-Za-z0-9_-]/g,"");
    if(h.length<3){ toast("Username needs at least 3 characters"); return; }
    try{
      const { error } = await sb.from("profiles").update({username:h, role:OB.role||"buyer"}).eq("id",u.id);
      if(error){ if(String(error.message||"").includes("duplicate")) { toast("That username is taken — try another"); return; } throw error; }
      u.username=h; u.role=OB.role||"buyer"; u.onboarded=true; OB={};
      toast("Welcome, @"+h);
      if(postAuthGo){ const g=postAuthGo; postAuthGo=null; location.hash=g; render(); } else location.hash="#/me";
    }catch(e){ die(e); }
  };

  /* ---------- reviews: live rvPost = same gates, database publish ---------- */
  rvPost = async function(){
    $("rv_guard").innerHTML=""; $("rv_banner").innerHTML="";
    if(!PARAMS.some(p=>RV.ratings[p.key]>0)){
      $("rv_banner").innerHTML=`<div class="banner err">Rate at least one parameter — tap the stars on whichever ones you experienced.</div>`;
      return;
    }
    const t=(RV.text||"").trim();
    if(t){
      const issues=screenText(t);
      if(issues.length){
        $("rv_guard").innerHTML=chatGuardHTML(issues,t)
          .replace('chatGuardAccept()','rvGuardAccept()').replace('chatGuardDismiss()','rvGuardDismiss()');
        return;
      }
    }
    if(!session){ openAuth("#/review/"+RV.slug); toast("Sign in to post — your draft is saved"); return; }
    if(!me().onboarded){ postAuthGo="#/review/"+RV.slug; location.hash="#/onboarding"; return; }
    const b=brokerBySlug(RV.slug); if(!b||!b.dbId){ toast("Broker not found"); return; }
    const ratings={}; PARAMS.forEach(p=>{ if(RV.ratings[p.key]>0) ratings[p.key]=RV.ratings[p.key]; });
    try{
      if(RV.editingId){
        const { error } = await sb.from("reviews").update({ ratings, text:t, ctx:(RV.ctx||"").slice(0,90), stage:RV.stage||"", reviewer_role:RV.revRole||"buyer" }).eq("id",RV.editingId);
        if(error) throw error;
        const ex=REVIEWS.find(x=>x.id===RV.editingId);
        if(ex){ ex.r=ratings; ex.text=t; ex.ctx=(RV.ctx||"").slice(0,90); ex.stage=RV.stage||""; ex.role=RV.revRole||"buyer"; ex.date=new Date().toISOString().slice(0,10); }
        RV.done=true; location.hash="#/broker/"+RV.slug; toast("Review updated — rankings recalculated."); return;
      }
      const { data, error } = await sb.from("reviews").insert({
        broker_id:b.dbId, author_id:session.userId, ratings, text:t,
        ctx:(RV.ctx||"").slice(0,90), stage:RV.stage||"", reviewer_role:RV.revRole||"buyer" }).select("id,created_at").single();
      if(error){
        if(String(error.message||"").includes("duplicate")) { toast("You've already reviewed this broker — use Edit your review instead."); return; }
        throw error;
      }
      const r={ id:data.id, broker:RV.slug, user:session.userId, date:String(data.created_at).slice(0,10),
        stage:RV.stage||"", ctx:(RV.ctx||"").slice(0,90), r:ratings, text:t, ai:false, helpful:0, status:"published", role:RV.revRole||"buyer" };
      REVIEWS.push(r); myReviews.push(r); RV.done=true;
      maybePersonalTiebreak(r,()=>{ location.hash="#/broker/"+r.broker; toast("Published — rankings updated. Thank you."); });
    }catch(e){ die(e); }
  };

  adminDeleteReview = async function(id){
    const r=REVIEWS.find(x=>x.id===id); if(!r) return;
    if(!confirm("Delete this review? Rankings recompute.")) return;
    try{
      const { error } = await sb.from("reviews").update({status:"removed"}).eq("id",id);
      if(error) throw error;
      r.status="removed"; render(); toast("Review removed");
    }catch(e){ die(e); }
  };

  voteHelpful = async function(id){
    if(!session){ openAuth(location.hash); return; }
    try{
      if(helpfulVotes.has(id)){
        await sb.from("review_votes").delete().eq("review_id",id).eq("voter_id",session.userId);
        helpfulVotes.delete(id);
        const r=REVIEWS.find(x=>x.id===id); if(r) r.helpful=Math.max(0,r.helpful-1);
      } else {
        const { error } = await sb.from("review_votes").insert({review_id:id, voter_id:session.userId});
        if(error) throw error;
        helpfulVotes.add(id);
      }
      render();
    }catch(e){ die(e); }
  };

  submitReport = async function(id){
    if(!session){ closeModal(); openAuth(location.hash); return; }
    try{
      const { error } = await sb.from("reports").insert({ review_id:id, reporter_id:session.userId,
        reason:$("repReason").value, detail:$("repDetail").value||"" });
      if(error) throw error;
      myReports.add(id); closeModal(); render(); toast("Reported — the moderator will take a look.");
    }catch(e){ die(e); }
  };

  /* ---------- watchlist / prefs / requests ---------- */
  toggleWatch = async function(slug){
    if(!session){ openAuth(location.hash); return; }
    const b=brokerBySlug(slug); if(!b||!b.dbId) return;
    try{
      if(watchlist.has(slug)){
        await sb.from("watchlists").delete().eq("user_id",session.userId).eq("broker_id",b.dbId);
        watchlist.delete(slug); toast("Removed from your watchlist");
      } else {
        const { error } = await sb.from("watchlists").insert({user_id:session.userId, broker_id:b.dbId});
        if(error) throw error;
        watchlist.add(slug); toast("Saved to your watchlist");
      }
      render();
    }catch(e){ die(e); }
  };

  setPTB = async function(a,b,winner){
    const key=[a,b].sort().join("|");
    personalTB[key]=winner; closeModal();
    try{ await sb.from("personal_prefs").upsert({user_id:session.userId, pair_key:key, winner}); }catch(e){}
    if(window._ptbDone){ const d=window._ptbDone; window._ptbDone=null; d(); }
  };

  submitSuggest = async function(){
    const name=($("sg_name").value||"").trim();
    if(!name){ toast("The broker's name is required"); return; }
    if(!session){ closeModal(); openAuth(location.hash); toast("Sign in first, then request the listing"); return; }
    try{
      const { error } = await sb.from("listing_requests").insert({ name,
        firm:($("sg_firm").value||"").trim(), location:($("sg_loc").value||"").trim(),
        info:($("sg_info").value||"").trim(), requested_by:session.userId });
      if(error) throw error;
      closeModal(); toast("Request sent — we'll add them after a quick check.");
    }catch(e){ die(e); }
  };

  /* ---------- admin: broker CRUD, bulk import, requests ---------- */
  async function insertBrokerRows(rows){   // rows: [{slug,name,firm,city,state,specialty,photo,website,source}]
    const out=[];
    for(let i=0;i<rows.length;i+=500){
      const chunk=rows.slice(i,i+500);
      const { data, error } = await sb.from("brokers").insert(chunk).select("id,slug");
      if(error) throw error;
      out.push(...data);
    }
    return out;
  }
  const freshSlug=(name)=>{ let base=name.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"broker";
    let slug=base,i=2; const set=new Set(BROKERS.map(b=>b.slug));
    while(set.has(slug)) slug=base+"-"+(i++); return slug; };

  adminAddBroker = async function(){
    const name=($("ab_name").value||"").trim();
    if(!name){ $("ab_banner").innerHTML=`<div class="banner err">Name is required.</div>`; return; }
    if(BROKERS.some(b=>b.name.toLowerCase()===name.toLowerCase())){ $("ab_banner").innerHTML=`<div class="banner err">Already listed.</div>`; return; }
    try{
      const row={ slug:freshSlug(name), name, firm:($("ab_firm").value||"Independent").trim(),
        city:($("ab_city").value||"—").trim(), state:$("ab_state").value,
        specialty:($("ab_spec").value||"general SMB").trim(), source:"admin-added" };
      const ids=await insertBrokerRows([row]);
      BROKERS.unshift({...row, photo:"", website:"", dbId:ids[0].id});
      render(); toast(`Added ${name}`);
    }catch(e){ die(e); }
  };

  adminRemoveBroker = async function(slug){
    const b=brokerBySlug(slug); if(!b) return;
    const n=reviewsFor(slug).length;
    if(!confirm(`Remove ${b.name}${n?` and their ${n} review(s)`:""}?`)) return;
    try{
      const { error } = await sb.from("brokers").delete().eq("id",b.dbId);
      if(error) throw error;
      BROKERS=BROKERS.filter(x=>x.slug!==slug);
      REVIEWS=REVIEWS.filter(r=>r.broker!==slug);
      render(); toast(`${b.name} removed`);
    }catch(e){ die(e); }
  };

  saveBrokerEdit = async function(slug){
    const b=brokerBySlug(slug); if(!b) return;
    const name=($("be_name").value||"").trim();
    if(!name){ toast("Name can't be empty"); return; }
    const pinRaw=($("be_pin")&&$("be_pin").value||"").trim();
    const pin=pinRaw?Math.max(1,parseInt(pinRaw,10)||0):null;
    const patch={ name, firm:($("be_firm").value||"").trim()||"Independent",
      city:($("be_city").value||"").trim()||"—", state:(($("be_state").value||"").trim()||"—").toUpperCase(),
      specialty:($("be_spec").value||"").trim()||"general SMB",
      photo:($("be_photo").value||"").trim(), website:($("be_web").value||"").trim(), rank_pin:pin };
    try{
      const { error } = await sb.from("brokers").update(patch).eq("id",b.dbId);
      if(error) throw error;
      Object.assign(b,{...patch, rankPin:pin||undefined}); delete patch.rank_pin;
      if(!pin) delete b.rankPin;
      closeModal(); render(); toast(pin?`Saved — ${name} pinned at #${pin}`:`Saved — ${name} updated`);
    }catch(e){ die(e); }
  };

  commitBulk = async function(){
    if(!bulkPending||(!bulkPending.rows.length&&!bulkPending.updates.length)) return;
    const t0=Date.now();
    try{
      const rows=bulkPending.rows.map(r=>({ slug:freshSlug(r.name), name:r.name, firm:r.firm,
        city:r.city, state:r.state, specialty:r.specialty, photo:r.photo||"", website:r.website||"",
        source:"bulk-import" }));
      const seen=new Set(BROKERS.map(b=>b.slug)); // freshSlug uses live set; ensure uniqueness within batch
      rows.forEach(r=>{ let s=r.slug,i=2; while(seen.has(s)) s=r.slug+"-"+(i++); seen.add(s); r.slug=s; });
      const ids=rows.length?await insertBrokerRows(rows):[];
      const idMap=new Map(ids.map(x=>[x.slug,x.id]));
      rows.forEach(r=>BROKERS.push({...r, rankPin:undefined, dbId:idMap.get(r.slug)}));
      for(const u of bulkPending.updates){
        const b=brokerBySlug(u.slug); if(!b) continue;
        const { error } = await sb.from("brokers").update(u.patch).eq("id",b.dbId);
        if(error) throw error;
        Object.assign(b,u.patch);
      }
      const n=bulkPending.rows.length, m=bulkPending.updates.length;
      bulkPending=null; listPage=0; render();
      toast(`${n?`Imported ${n.toLocaleString()} new`:""}${n&&m?", ":""}${m?`updated ${m}`:""} in ${((Date.now()-t0)/1000).toFixed(1)}s — saved to the database`);
    }catch(e){ die(e); }
  };

  adminApproveSug = async function(id){
    const s=suggestions.find(x=>x.id===id); if(!s) return;
    const loc=(s.loc||"").split(",").map(x=>x.trim());
    try{
      const row={ slug:freshSlug(s.name), name:s.name, firm:s.firm||"Independent",
        city:loc[0]||"—", state:(loc[1]||"—").toUpperCase().slice(0,2), specialty:"general SMB", source:"admin-added" };
      const ids=await insertBrokerRows([row]);
      BROKERS.unshift({...row, photo:"", website:"", dbId:ids[0].id});
      await sb.from("listing_requests").update({status:"approved"}).eq("id",id);
      s.status="approved"; render(); toast(`${s.name} listed`);
    }catch(e){ die(e); }
  };
  adminDismissSug = async function(id){
    const s=suggestions.find(x=>x.id===id); if(!s) return;
    try{ await sb.from("listing_requests").update({status:"dismissed"}).eq("id",id);
      s.status="dismissed"; render(); toast("Request dismissed"); }catch(e){ die(e); }
  };
  modAct = async function(repId,action){
    const rep=REPORTS.find(r=>r.id===repId); if(!rep) return;
    try{
      await sb.from("reports").update({status:action}).eq("id",repId);
      rep.status=action;
      if(action==="removed"&&rep.reviewId){
        await sb.from("reviews").update({status:"removed"}).eq("id",rep.reviewId);
        const rev=REVIEWS.find(r=>r.id===rep.reviewId); if(rev) rev.status="removed";
      }
      render(); toast("Done");
    }catch(e){ die(e); }
  };
  adminRemoveBatch = function(){ toast("In production, remove imports via Manage brokers or a database restore — batch undo arrives with the next update."); };

  /* ---------- verification requests (member asks; admin approves) ---------- */
  requestVerify = async function(){
    if(!session){ openAuth(location.hash); return; }
    try{
      const { error } = await sb.from("verification_requests").insert({user_id:session.userId});
      if(error) throw error;
      toast("Verification requested — the admin will confirm your buyer activity.");
    }catch(e){ die(e); }
  };
  window.adminApproveVerif = async function(reqId,userId){
    try{
      await sb.from("profiles").update({tier:"verified"}).eq("id",userId);
      await sb.from("verification_requests").update({status:"approved"}).eq("id",reqId);
      const u=USERS.find(x=>x.id===userId); if(u) u.tier="verified";
      window._verifRequests=window._verifRequests.filter(v=>v.id!==reqId);
      render(); toast("Member verified");
    }catch(e){ die(e); }
  };

  /* ---------- admin gate: owner role instead of passcode ---------- */
  adminLoginView = function(){
    return `${nav()}
    <div class="wrap"><div class="obshell">
      <span class="eyebrow">Owner backend</span>
      <h1 class="title" style="font-size:28px;margin-top:10px">Admin</h1>
      <div class="panel" style="margin-top:16px">
        <p class="note" style="margin-top:0">${session
          ? "This account doesn't have admin access. The backend is available only to the site owner's account."
          : "Sign in with the owner account to manage the directory."}</p>
        ${session?"":`<button class="btn" style="width:100%;margin-top:8px" onclick="openAuth('#/admin')">Sign in</button>`}
      </div>
    </div></div>${footer()}`;
  };
  adminLogout = function(){ location.hash="#/"; render(); };

  /* ---------- boot ---------- */
  const pb=document.querySelector(".protobar");
  if(pb) pb.remove();                       // no "prototype" ribbon on the real site
  liveInit();
}
</script>
</body></html>
