<!DOCTYPE html><html lang="en"><head>
<title>The Broker Index</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Independent ratings and reviews of U.S. business brokers, from the buyers and sellers who actually worked with them.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#f3f4f1; --card:#ffffff; --ink:#15181b; --muted:#5b6167; --faint:#8b9197;
    --line:#d9dad2; --gold:#9c7a1c; --silver:#767e86; --bronze:#8f5630;
    --star:#b8901f; --star-empty:#dcdcd2; --accent:#24425c; --accent2:#33587a;
    --verified:#2c5e78; --ok:#2e7d54; --warn:#a8862c; --danger:#993824;
    --radius:4px;
    --shadow:0 0 0 1px #dcdbd3;
    --shadow-hover:0 0 0 1px #a8b0b7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:"Libre Franklin",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .title,.profile h2,.modal h3,.prose h2,.prose h3,.tiecard h3,.stat .n,.bigscore .n,
  .scorecell .num,.ranknum{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---------- proto ribbon ---------- */
  .protobar{background:#111417;color:#c6c9cc;font-size:12px;font-weight:600;text-align:center;padding:7px 14px}
  .protobar b{color:#fff}
  .protobar .lk{color:#d9c26f;font-weight:700;cursor:pointer;border-bottom:1px dotted #d9c26f}

  /* ---------- nav ---------- */
  .nav{max-width:980px;margin:0 auto;padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .wordmark{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px}
  .wordmark .mark{display:none}
  .wordmark::after{content:"est. 2026";font-family:"Libre Franklin",sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .nav .links{display:flex;gap:20px;font-size:14px;color:var(--muted);font-weight:600;align-items:center;flex-wrap:wrap}
  .nav .links a:hover{color:var(--ink)}
  .nav .links a.active{color:var(--ink)}
  .navbtn{background:var(--accent);color:#fff;border:none;border-radius:3px;padding:8px 16px;font-weight:800;font-size:13.5px}
  .navbtn:hover{background:#1a3349}
  .navuser{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
  .navuser:hover{box-shadow:var(--shadow)}
  .uav{width:26px;height:26px;border-radius:50%;background:#414c56;color:#f2f2ee;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}

  .wrap{max-width:980px;margin:0 auto;padding:0 24px 90px}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:54px 0 34px}
  .eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);background:none;border-top:2px solid var(--ink);padding:10px 2px 0;margin-bottom:16px}
  h1.title{font-size:clamp(38px,7vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
  h1.title{font-weight:700}
  .hero p.sub{max-width:620px;margin:16px auto 0;color:var(--muted);font-size:16px}
  .hero .how{display:inline-block;margin-top:18px;font-weight:700;font-size:14.5px;color:var(--accent);border-bottom:1.5px solid rgba(36,66,92,.35);padding-bottom:2px}
  .hero .how:hover{border-color:var(--accent)}
  .statline{display:flex;justify-content:center;gap:26px;margin-top:26px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

  /* ---------- search / controls ---------- */
  .controls{max-width:760px;margin:8px auto 0;display:flex;flex-direction:column;gap:12px}
  .searchbox{position:relative}
  .searchbox input{width:100%;font:inherit;font-size:15.5px;padding:13px 18px 13px 44px;border:1px solid var(--line);border-radius:3px;background:var(--card);box-shadow:var(--shadow);outline:none}
  .searchbox input:focus{border-color:var(--accent)}
  .searchbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:16px}
  .filterrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .filterrow select{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:7px 10px;box-shadow:var(--shadow);cursor:pointer;outline:none}
  .datastatus{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);margin-left:auto}
  .datastatus .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

  /* ---------- ranking board ---------- */
  .board{max-width:760px;margin:24px auto 0;display:flex;flex-direction:column;gap:24px}
  .row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px}
  .rankcell{display:flex;align-items:center;justify-content:center;gap:2px;user-select:none}
  .ranknum{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rank-1 .ranknum{color:var(--gold)}
  .rank-2 .ranknum{color:var(--silver)}
  .rank-3 .ranknum{color:var(--bronze)}
  .laurel{width:22px;height:44px;flex:none;color:#b9bcb4}
  .laurel.flip{transform:scaleX(-1)}
  .rank-1 .laurel{color:var(--gold)}
  .rank-2 .laurel{color:var(--silver)}
  .rank-3 .laurel{color:var(--bronze)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;display:flex;align-items:center;gap:16px;min-height:104px;transition:box-shadow .18s ease,transform .18s ease;position:relative}
  a.card:hover{box-shadow:var(--shadow-hover);background:#fcfcfa}
  .avatar{width:64px;height:64px;border-radius:3px;object-fit:cover;flex:none;background:#eee}
  .avatar.initials{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;font-family:"Source Serif 4",Georgia,serif;color:#f2f2ee;background:#414c56}
  .card .info{flex:1;min-width:0}
  .card .name{font-size:17.5px;font-weight:800;letter-spacing:-.01em}
  .card .firm{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
  .card .desc{font-size:13px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .scorecell{text-align:right;flex:none}
  .scorecell .num{font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .scorecell .num small{font-size:12px;color:var(--faint);font-weight:700}
  .scorecell .rc{font-size:11.5px;color:var(--faint);font-weight:700;margin-top:2px}
  .card .go{color:var(--faint);font-size:18px;flex:none;margin-left:2px}
  .card.empty{justify-content:center;color:var(--faint);font-size:14px;font-weight:600}
  .loadmore{margin:26px auto 0;display:block;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:11px 26px;font-weight:800;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
  .loadmore:hover{color:var(--ink);box-shadow:var(--shadow-hover)}
  .pager{max-width:760px;margin:26px auto 0;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
  .pgbtn{min-width:38px;height:38px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:3px;font-weight:800;font-size:14px;color:var(--muted);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
  .pgbtn:hover:not(:disabled){color:var(--ink);border-color:var(--accent)}
  .pgbtn.cur{background:var(--accent);border-color:var(--accent);color:#fff}
  .pgbtn:disabled{opacity:.4;cursor:default}
  .pgdots{color:var(--faint);font-weight:800;padding:0 2px}
  .hometabs{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .tab{font:inherit;font-size:13.5px;font-weight:800;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
  .tab:hover{color:var(--ink);border-color:var(--accent2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .tct{font-weight:800;font-size:11.5px;background:rgba(0,0,0,.12);border-radius:999px;padding:1px 8px;margin-left:4px;font-variant-numeric:tabular-nums}
  .tab:not(.on) .tct{background:#eceded;color:var(--faint)}
  .recentrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:760px){.recentrow{grid-template-columns:repeat(2,1fr)}}
  .recentcard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:3px;box-shadow:var(--shadow);padding:10px 12px;transition:box-shadow .15s,transform .15s}
  .recentcard:hover{box-shadow:var(--shadow-hover);background:#fcfcfa}
  .avatar.sm{width:38px;height:38px;border-radius:3px}
  .avatar.initials.sm{font-size:14px}

  /* ---------- badges / chips ---------- */
  .stars{position:relative;display:inline-block;font-size:14px;line-height:1;letter-spacing:2px;color:var(--star-empty);white-space:nowrap}
  .stars .fill{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);white-space:nowrap}
  .stars.lg{font-size:22px;letter-spacing:3px}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#edf1f4;color:var(--accent)}
  .chip.no{background:#eef0ee;color:var(--muted)}
  .vbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(42,111,143,.1);color:var(--verified)}
  .vbadge.member{background:#eef0ee;color:var(--muted)}
  .confbadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
  .conf-high{background:rgba(58,164,111,.12);color:#2c7a53}
  .conf-med{background:rgba(201,161,60,.14);color:#8a6d1e}
  .conf-low{background:#eef0ee;color:var(--muted)}
  .newchip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(42,111,143,.1);color:var(--verified)}

  /* ---------- panels / detail ---------- */
  .back{display:inline-flex;align-items:center;gap:7px;margin:30px 0 18px;font-size:14px;font-weight:700;color:var(--muted)}
  .back:hover{color:var(--ink)}
  .profile{background:var(--card);border-radius:3px;box-shadow:var(--shadow);padding:30px 34px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .profile .avatar{width:96px;height:96px;border-radius:3px}
  .profile .avatar.initials{font-size:32px}
  .profile .who{flex:1;min-width:220px}
  .rankchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;margin-bottom:10px;background:#eceded;color:#6b7076}
  .rankchip.r1{background:rgba(185,130,42,.13);color:var(--gold)}
  .rankchip.r2{background:rgba(143,149,156,.15);color:#6d747c}
  .rankchip.r3{background:rgba(176,106,59,.13);color:var(--bronze)}
  .profile h2{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .profile .firm{color:var(--muted);font-weight:600;margin-top:4px}
  .bigscore{text-align:center;flex:none;padding:6px 10px}
  .bigscore .n{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .bigscore .n small{font-size:19px;color:var(--faint)}
  .bigscore .lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:8px}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:22px;align-items:start}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px}
  .panel h3{font-size:12.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
  .param{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .param:last-child{border-bottom:none}
  .param .pl{font-weight:700;font-size:14.5px}
  .param .pd{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:340px}
  .param .pr{text-align:right;flex:none}
  .param .pr .v{font-size:12px;color:var(--faint);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .fact{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .fact:last-child{border-bottom:none}
  .fact .k{color:var(--muted);font-weight:600}
  .fact .v{font-weight:700;text-align:right}

  /* ---------- review cards on broker page ---------- */
  .rev{border-bottom:1px solid var(--line);padding:18px 0}
  .rev:last-child{border-bottom:none}
  .revhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .revhead .uav{width:30px;height:30px;font-size:12px}
  .revhead .un{font-weight:800;font-size:14px}
  .revhead .dt{font-size:12px;color:var(--faint);font-weight:600;margin-left:auto}
  .revscore{display:flex;align-items:center;gap:10px;margin-top:8px}
  .revscore .n{font-weight:800;font-variant-numeric:tabular-nums}
  .revctx{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
  .revtext{margin-top:10px;padding:14px 18px;background:#f7f7f4;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;font-size:14.5px;color:#343a3f}
  .revtext .ailbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .revfoot{display:flex;gap:16px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--faint)}
  .revfoot button{background:none;border:none;color:var(--faint);font-weight:700;font-size:12.5px;padding:0}
  .revfoot button:hover{color:var(--ink)}
  .revfoot button.reported{color:var(--danger)}
  .minibars{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .minibar{font-size:10.5px;font-weight:700;color:var(--muted);background:#eef0ee;border-radius:3px;padding:2px 8px}
  .minibar b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- buttons / forms ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:800;background:var(--accent);color:#fff;border:none;border-radius:3px;padding:12px 24px}
  .btn:hover{background:#1a3349}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink);background:#fff}
  .btn.danger{background:var(--danger)}
  .btn.danger:hover{background:#7e2c1b}
  .btn.sm{padding:8px 16px;font-size:13px;border-radius:3px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  label.fl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 4px}
  input.fi,textarea.fi,select.fi{width:100%;font:inherit;font-size:14.5px;padding:10px 13px;border:1px solid var(--line);border-radius:3px;background:#fafaf7;outline:none}
  input.fi:focus,textarea.fi:focus{border-color:var(--accent)}
  textarea.fi{min-height:84px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .note{font-size:12.5px;color:var(--faint);margin-top:8px}
  .banner{border-radius:3px;padding:11px 15px;font-size:13.5px;font-weight:600;margin-top:14px}
  .banner.ok{background:#e8f0ea;color:var(--accent)}
  .banner.err{background:#f4e6e1;color:var(--danger)}
  .banner.warn{background:#f6f1e2;color:#77621f}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(17,20,23,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:460px;width:100%;padding:28px 30px;position:relative;margin:auto}
  .modal.wide{max-width:560px}
  .modal h3{font-size:21px;letter-spacing:-.01em;margin-bottom:4px}
  .modal .x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--faint);line-height:1}
  .modal .x:hover{color:var(--ink)}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:700;font-size:14.5px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:11px;margin-top:16px}
  .gbtn:hover{box-shadow:var(--shadow)}
  .orline{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;font-weight:700;margin:16px 0 2px}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- review flow ---------- */
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  @media(max-width:640px){.modes{grid-template-columns:1fr}}
  .mode{border:2px solid var(--line);border-radius:3px;padding:20px 16px;text-align:center;cursor:pointer;background:#fafaf7;transition:all .12s}
  .mode:hover{border-color:var(--accent)}
  .mode .mi{font-size:26px}
  .mode .mt{font-weight:800;font-size:15px;margin-top:8px}
  .mode .md{font-size:12.5px;color:var(--muted);margin-top:4px}
  .mode .rec{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(36,66,92,.1);color:var(--accent);border-radius:999px;padding:2px 8px;margin-top:8px}

  .chatwrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;height:min(640px,72vh);overflow:hidden}
  .chathead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .chathead .ai{width:32px;height:32px;border-radius:3px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .chathead .t{font-weight:800;font-size:14.5px}
  .chathead .s{font-size:11.5px;color:var(--faint);font-weight:600}
  .chatlog{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:11px 15px;border-radius:3px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
  .msg.ai{background:#eef0ee;border-bottom-left-radius:6px;align-self:flex-start}
  .msg.me{background:var(--accent);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
  .msg.sys{background:#f6f1e2;color:#77621f;font-size:13px;align-self:center;max-width:92%;border-radius:3px}
  .quickrow{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;max-width:88%}
  .qpick{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
  .qpick:hover{border-color:var(--accent);color:var(--accent)}
  .starrow{display:flex;gap:4px;align-self:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
  .starrow button{background:none;border:none;font-size:22px;line-height:1;color:var(--star-empty);padding:0 2px}
  .starrow button.on,.starrow button:hover{color:var(--star)}
  .starrow.big{border:none;background:none;padding:0;gap:2px;flex:none}
  .starrow.big button{font-size:31px;padding:2px 3px;transition:transform .08s}
  .starrow.big button:hover{transform:none;color:var(--star)}
  @media(max-width:560px){.starrow.big button{font-size:26px}}
  .chatin{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-end}

/* =====================================================================
   RANKING ALGORITHM (v2 — community)
   ---------------------------------------------------------------------
   1. Review overall = mean of its six parameter ratings.
   2. Review weight  = reviewer tier (verified 1.0 · member 0.55)
                       × recency decay (half-life 18 months).
   3. Broker raw     = weighted mean of review overalls.
   4. Broker score   = Bayesian shrink toward the global mean:
                       (W·raw + M·prior) / (W + M),  M = 2.5
      → few-review brokers can't rocket to #1 on one 5.0 review,
        and one bad-faith review can't nuke an established broker.
   5. Rank order     = score desc → total weight desc → review count
                       desc → name. Scores shown to 2 decimals, so
                       meaningful ties are rare; remaining ties are
                       broken by evidence (weight), not coin flips.
   ===================================================================== */
const TIER_W={verified:1.0,member:0.55};
const HALF_LIFE_DAYS=548;
const BAYES_M=2.5;
const NOW=Date.now();

const revOverall=r=>{ // mean of ONLY the parameters this reviewer rated
  let n=0,sum=0; PARAMS.forEach(p=>{ const v=r.r[p.key]; if(v>0){n++;sum+=v;} });
  return n?sum/n:0;
};
const revRatedCount=r=>PARAMS.reduce((a,p)=>a+((r.r[p.key]||0)>0?1:0),0);
function revWeight(r){
  const u=userById(r.user);
  const tw=TIER_W[(u&&u.tier)||"member"]||0.55;
  const age=Math.max(0,(NOW-Date.parse(r.date))/86400000);
  return tw*Math.pow(0.5,age/HALF_LIFE_DAYS);
}
function globalPrior(){
  const all=publishedReviews();
  if(!all.length) return 3.5;
  let sw=0,s=0; all.forEach(r=>{const w=revWeight(r);sw+=w;s+=w*revOverall(r);});
  return s/sw;
}
function brokerStats(slug){
  const revs=reviewsFor(slug);
  if(!revs.length) return null;
  let W=0,S=0; const par={};
  const roles={buyer:{w:0,s:0,count:0}, seller:{w:0,s:0,count:0}};
  PARAMS.forEach(p=>par[p.key]={w:0,s:0});
  revs.forEach(r=>{
    const w=revWeight(r); W+=w; S+=w*revOverall(r);
    const rr=roles[r.role==="seller"?"seller":"buyer"];
    rr.w+=w; rr.s+=w*revOverall(r); rr.count++;
    PARAMS.forEach(p=>{ const v=r.r[p.key]; if(v>0){par[p.key].w+=w; par[p.key].s+=w*v;} });
  });
  const raw=S/W, prior=globalPrior();
  const score=(W*raw+BAYES_M*prior)/(W+BAYES_M);
  const params={}; PARAMS.forEach(p=>params[p.key]=par[p.key].w?par[p.key].s/par[p.key].w:null);   // null = no one has rated this parameter yet
  const conf=W>=3?"high":W>=1.2?"med":"low";
  return { count:revs.length, weight:W, raw, score, params, conf,
           byRole:{ buyer: roles.buyer.count?{avg:roles.buyer.s/roles.buyer.w, count:roles.buyer.count}:null,
                    seller: roles.seller.count?{avg:roles.seller.s/roles.seller.w, count:roles.seller.count}:null },
           verifiedCount:revs.filter(r=>{const u=userById(r.user);return u&&u.tier==="verified";}).length };
}
function rankedBrokers(){
  const list=BROKERS.map(b=>({b,st:brokerStats(b.slug)})).filter(x=>x.st)
    .sort((a,c)=> (c.st.score-a.st.score) || (c.st.weight-a.st.weight) || (c.st.count-a.st.count) || a.b.name.localeCompare(c.b.name));
  /* admin rank pins: force position regardless of score (manual override) */
  const pinned=list.filter(x=>x.b.rankPin>=1).sort((a,c)=>a.b.rankPin-c.b.rankPin);
  if(pinned.length){
    const rest=list.filter(x=>!(x.b.rankPin>=1));
    pinned.forEach(x=>rest.splice(Math.min(Math.max(0,x.b.rankPin-1),rest.length),0,x));
    return rest;
  }
  return list;
}
function rankOf(slug){ return rankedBrokers().findIndex(x=>x.b.slug===slug)+1; }

/* =====================================================================
   AI GUARDRAIL — content screening (simulated)
   Real build: a moderation model reviews every submission before publish.
   ===================================================================== */
const G_ACCUSE=[["fraud","fraudulent","defraud"],["scam","scammer","scamming"],["crook","criminal","crim"],["thief","stole","stealing","theft"],["liar","lying"],["illegal","launder"],["corrupt"]];
const G_PROFANE=["fuck","fucking","shit","shitty","asshole","bastard","bitch","damn it","goddamn"];
const G_SLUR_NOTE=/(idiot|moron|scumbag|sleazebag|snake|con man|con-man|conman)/i;
const RE_PHONE=/\b(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/;
const RE_EMAIL=/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/i;

function screenText(text){
  const t=String(text||""), low=t.toLowerCase(), issues=[];
  G_ACCUSE.forEach(group=>{ group.forEach(w=>{ if(low.includes(w)&&!issues.some(i=>i.word===group[0]))
    issues.push({word:group[0],found:w,kind:"accusation",
      why:`“${w}” asserts unlawful conduct as fact. Reviews must describe your experience, not make legal accusations the platform can't verify.`}); });});
  G_PROFANE.forEach(w=>{ if(low.includes(w)) issues.push({word:w,found:w,kind:"profanity",why:`“${w}” — profanity isn't published; say what happened instead.`}); });
  const m=t.match(G_SLUR_NOTE);
  if(m) issues.push({word:m[0],found:m[0],kind:"insult",why:`“${m[0]}” is a personal insult. Describe the behavior, not the person's character.`});
  if(RE_PHONE.test(t)) issues.push({word:"phone number",found:(t.match(RE_PHONE)||[""])[0],kind:"pii",why:"Personal contact details are removed to protect privacy."});
  if(RE_EMAIL.test(t)) issues.push({word:"email address",found:(t.match(RE_EMAIL)||[""])[0],kind:"pii",why:"Personal contact details are removed to protect privacy."});
  return issues;
}
function sanitizeText(text,issues){
  let out=String(text||"");
  /* phrase-level rewrites first, so the result still reads as a sentence */
  out=out.replace(/\b(is|was|are|were)\s+(a |an |a total |an absolute |a complete )?(fraud|fraudulent|scam|scammer|crook|criminal|thief|liar|con\s?-?man)\b/gi,"$1 not straightforward with us, in my experience");
  out=out.replace(/\b(is|was|are|were)\s+(a |an |a total |an absolute |a complete )?(asshole|bastard|bitch|idiot|moron|scumbag|sleazebag|snake)\b/gi,"$1 very difficult to work with");
  out=out.replace(/\b(a|an)\s+(asshole|bastard|bitch|idiot|moron|scumbag|sleazebag|snake|crook|thief|liar|fraud|scammer)\b/gi,"difficult to deal with");
  out=out.replace(/\b(fucking|shitty)\s+/gi,"");
  issues.forEach(i=>{
    const rep={accusation:"questionable",profanity:"",insult:"difficult",pii:"[contact removed]"}[i.kind]??"";
    out=out.replace(new RegExp(i.found.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),rep);
  });
  return out.replace(/\s{2,}/g," ").replace(/\s+([,.!?])/g,"$1").trim();
}
function highlightIssues(text,issues){
  let out=esc(text);
  issues.forEach(i=>{ out=out.replace(new RegExp(esc(i.found).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>`<mark>${m}</mark>`); });
  return out;
}

let _laurelCache=null;
function laurelSVG(){
  if(_laurelCache) return _laurelCache;
  const P0=[16.5,44],P1=[2.5,24],P2=[16.5,4];
  const pt=t=>[(1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];
  const ang=t=>{const dx=2*(1-t)*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]);const dy=2*(1-t)*(P1[1]-P0[1])+2*t*(P2[1]-P1[1]);return Math.atan2(dy,dx)*180/Math.PI;};
  const leaf=(x,y,rot,len,w)=>`<path fill="currentColor" transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(1)})" d="M0 0 Q ${w} ${(-len*0.45).toFixed(2)} 0 ${-len} Q ${-w} ${(-len*0.45).toFixed(2)} 0 0 Z"/>`;
  let leaves="";
  [0.12,0.31,0.5,0.69,0.88].forEach(t=>{
    const [x,y]=pt(t),a=ang(t)+90,len=6.6+1.8*Math.sin(Math.PI*t),w=2.1+0.4*Math.sin(Math.PI*t);
    leaves+=leaf(x,y,a-38,len,w); leaves+=leaf(x,y,a+38,len,w);
  });
  {const [x,y]=pt(1);leaves+=leaf(x,y,ang(1)+90,5.5,1.9);}
  _laurelCache=`<svg class="laurel" viewBox="0 0 24 48" aria-hidden="true"><path d="M${P0[0]} ${P0[1]} Q ${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>${leaves}</svg>`;
  return _laurelCache;
}

  return `<div class="rankcell"><span class="ranknum">${rank}</span></div>`;
}

let homeQ="", homeState="", homeSpec="", homeSort="rank", listPage=0;
let revFilter="all", revFilterSlug=null;   // buyer/seller filter on a broker page
const PER_PAGE=10;

function pagerHTML(cur,pages){
  const btn=(p,label,curOn,dis)=>`<button class="pgbtn ${curOn?'cur':''}" ${dis?'disabled':''} onclick="gotoListPage(${p})">${label}</button>`;
  const parts=[btn(cur-1,"‹ Prev",false,cur===0)];
  const win=new Set([0,pages-1]);
  for(let p=cur-2;p<=cur+2;p++) if(p>=0&&p<pages) win.add(p);
  const list=[...win].sort((a,b)=>a-b);
  let prev=-1;
  list.forEach(p=>{ if(prev>=0&&p-prev>1) parts.push(`<span class="pgdots">…</span>`); parts.push(btn(p,p+1,p===cur,false)); prev=p; });
  parts.push(btn(cur+1,"Next ›",false,cur===pages-1));
  return `<div class="pager">${parts.join("")}<span class="note" style="margin:0 0 0 10px">Page ${cur+1} of ${pages}</span></div>`;
}
function gotoListPage(p){ listPage=Math.max(0,p); render(); const t=$("boardtop"); if(t) t.scrollIntoView({behavior:"instant",block:"start"}); }

function recentStrip(){
  const recent=publishedReviews().slice().sort((a,c)=>Date.parse(c.date)-Date.parse(a.date)).slice(0,4)
    .map(r=>({r,b:brokerBySlug(r.broker)})).filter(x=>x.b);
  if(!recent.length) return "";
  return `<div style="max-width:760px;margin:0 auto 26px">
    <h2 style="font-size:12.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:10px">Recently reviewed</h2>
    <div class="recentrow">${recent.map(x=>`
      <a class="recentcard" href="#/broker/${esc(x.b.slug)}">
        ${avatar(x.b,"sm")}
        <div style="min-width:0">
          <div style="font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.b.name)}</div>
          <div style="display:flex;align-items:center;gap:6px">${stars(revOverall(x.r))}<span style="font-size:11px;color:var(--faint);font-weight:700;white-space:nowrap">${esc(x.r.date.slice(5).replace("-","/"))}</span></div>
        </div>
      </a>`).join("")}</div>
  </div>`;
}

function homeView(){
  const ranked=rankedBrokers();
  const q=homeQ.trim().toLowerCase();
  const match=b=>(!q||b.name.toLowerCase().includes(q)||b.firm.toLowerCase().includes(q)||(b.city+" "+b.state).toLowerCase().includes(q)||b.specialty.toLowerCase().includes(q))
              &&(!homeState||b.state===homeState)
              &&(!homeSpec||b.specialty===homeSpec);
  const rankedF=ranked.filter(x=>match(x.b));
  const reviewedSet=new Set(publishedReviews().map(r=>r.broker));
  const unrated=BROKERS.filter(b=>!reviewedSet.has(b.slug)&&match(b))
                       .sort((a,b)=>a.name.localeCompare(b.name));
  const totalReviews=publishedReviews().length;
  const verifiedCount=USERS.filter(u=>u.tier==="verified").length;

  /* one continuous list: ranked brokers first, then A–Z unreviewed */
  const lastRev={};   // most recent review date per broker (for "Recently reviewed" sort)
  publishedReviews().forEach(r=>{ const t=Date.parse(r.date)||0; if(!lastRev[r.broker]||t>lastRev[r.broker]) lastRev[r.broker]=t; });
  let ratedItems=rankedF.map(x=>({kind:"ranked",b:x.b,st:x.st,rank:ranked.indexOf(x)+1}));
  if(homeSort==="score")   ratedItems=ratedItems.slice().sort((a,c)=>c.st.score-a.st.score);
  if(homeSort==="reviews") ratedItems=ratedItems.slice().sort((a,c)=>(c.st.count-a.st.count)||(c.st.score-a.st.score));
  if(homeSort==="recent")  ratedItems=ratedItems.slice().sort((a,c)=>(lastRev[c.b.slug]||0)-(lastRev[a.b.slug]||0));
  let combined=[...ratedItems, ...unrated.map(b=>({kind:"unrated",b}))];
  if(homeSort==="name") combined=combined.slice().sort((a,c)=>a.b.name.localeCompare(c.b.name));
  const pages=Math.max(1,Math.ceil(combined.length/PER_PAGE));
  if(listPage>=pages) listPage=pages-1;
  const slice=combined.slice(listPage*PER_PAGE,(listPage+1)*PER_PAGE);   // exactly 20 per page

  const rows=slice.map(item=>{
    const b=item.b;
    if(item.kind==="ranked"){
      const st=item.st;
      return `<div class="row">
        ${rankBadge(item.rank)}
        <a class="card" href="#/broker/${esc(b.slug)}" aria-label="Reviews of ${esc(b.name)}">
          ${avatar(b)}
          <div class="info">
            <div class="name">${esc(b.name)}</div>
            <div class="firm">${esc(b.firm)} · ${esc(b.city)}, ${esc(b.state)}</div>
            <div class="desc">${esc(b.specialty)} ${confBadge(st.conf)}</div>
          </div>
          <div class="scorecell">
            <div class="num">${fmt2(st.score)}<small> / 5</small></div>
            ${stars(st.score)}
            <div class="rc">${st.count} review${st.count===1?"":"s"} · ${st.verifiedCount} verified</div>
          </div>
          <div class="go">›</div>
        </a>
      </div>`;
    }
    return `<div class="row"><div class="rankcell"><span class="ranknum" style="color:var(--line)">—</span></div>
      <a class="card" href="#/broker/${esc(b.slug)}">
        ${avatar(b)}
        <div class="info">
          <div class="name">${esc(b.name)} ${b.unverifiedListing?'<span class="newchip">Unverified listing</span>':""}</div>
          <div class="firm">${esc(b.firm)} · ${esc(b.city)}, ${esc(b.state)}</div>
          <div class="desc">${esc(b.specialty)}</div>
        </div>
        <div class="scorecell"><div class="rc" style="font-size:12.5px">No reviews yet<br><b style="color:var(--accent)">Be the first →</b></div></div>
      </a>
    </div>`;
  });

  const stateOpts=[...new Set(BROKERS.map(b=>b.state))].sort().map(st=>`<option value="${st}" ${st===homeState?"selected":""}>${st}</option>`).join("");

  return `${nav('home')}
  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">${esc(SITE.tagline)}</span>
      <h1 class="title">${esc(SITE.heroTitle)}</h1>
      <p class="sub">${esc(SITE.heroText)}</p>
      <a class="how" href="#/methodology">How the ranking works →</a>
      <div class="statline">
        <div class="stat"><div class="n">${BROKERS.length.toLocaleString()}</div><div class="l">Brokers listed</div></div>
        <div class="stat"><div class="n">${totalReviews}</div><div class="l">Reviews</div></div>
        <div class="stat"><div class="n">${verifiedCount}</div><div class="l">Verified buyers</div></div>
      </div>
    </header>
    ${!q&&!homeState&&!homeSpec?recentStrip():""}
    <div class="controls" id="boardtop">
      <div class="searchbox"><span class="ic">⌕</span>
        <input id="homeSearch" type="search" placeholder="Search ${BROKERS.length.toLocaleString()} brokers by name, firm, city, or specialty…" value="${esc(homeQ)}" aria-label="Search brokers">
      </div>
      <div class="filterrow">
        <select id="homeStateSel" aria-label="Filter by state"><option value="">All states</option>${stateOpts}</select>
        <select id="homeSpecSel" aria-label="Filter by specialty"><option value="">All specialties</option>${[...new Set(BROKERS.map(b=>b.specialty).filter(Boolean))].sort().map(sp=>`<option value="${esc(sp)}" ${sp===homeSpec?"selected":""}>${esc(sp)}</option>`).join("")}</select>
        <select id="homeSortSel" aria-label="Sort brokers">${Object.entries({rank:"Sort: Global rank",score:"Sort: Highest rating",reviews:"Sort: Most reviews",recent:"Sort: Recently reviewed",name:"Sort: Name A–Z"}).map(([k,l])=>`<option value="${k}" ${k===homeSort?"selected":""}>${l}</option>`).join("")}</select>
        <span class="note" style="margin:0">${combined.length.toLocaleString()} broker${combined.length===1?"":"s"} · ${rankedF.length} ranked</span>
        <span class="datastatus"><span class="dot"></span>Live rankings</span>
      </div>
    </div>
    <div class="board" style="margin-top:20px">
      ${rows.join("")||`<div class="card empty" style="flex-direction:column;gap:10px"><span>${q||homeState?"No brokers match — not listed yet? Brokers are added by our team to keep the directory accurate.":"No brokers listed yet."}</span>${q?`<button class="btn sm" onclick="openSuggest(${JSON.stringify(homeQ.trim()).replace(/"/g,"&quot;")})">Request this listing</button>`:""}</div>`}
    </div>
    ${pagerHTML(listPage,pages)}
    <p class="note" style="text-align:center;margin-top:12px">Brokers with reviews are ranked at the top; the rest follow A–Z and join the ranking at their first review.</p>
    <p class="note" style="text-align:center;margin-top:8px">Missing a broker? <button class="btn ghost sm" onclick="openSuggest(${JSON.stringify(homeQ.trim()).replace(/"/g,"&quot;")})">Request a listing</button></p>
    <p class="disclaimer">${DISCLAIMER}</p>
  </div>
  ${footer()}`;
}

function brokerView(slug){
  const b=brokerBySlug(slug); if(!b) return notFoundView();
  const st=brokerStats(slug);
  const rank=st?rankOf(slug):0, total=rankedBrokers().length;
  if(revFilterSlug!==slug){ revFilter="all"; revFilterSlug=slug; }
  const revsAll=reviewsFor(slug).slice().sort((a,c)=>Date.parse(c.date)-Date.parse(a.date));
  const revs=revsAll.filter(r=>revFilter==="all"||(r.role==="seller"?"seller":"buyer")===revFilter);
  const alreadyMine=session&&revsAll.some(r=>r.user===session.userId);

  const paramRows=PARAMS.map(p=>`
    <div class="param">
      <div><div class="pl">${esc(p.label)}</div><div class="pd">${esc(p.short)}</div></div>
      <div class="pr">${st&&st.params[p.key]!=null?`${stars(st.params[p.key])}<div class="v">${fmt1(st.params[p.key])} / 5</div>`:`<div class="v" style="margin-top:8px">Not yet rated</div>`}</div>
    </div>`).join("");

  const revCards=revs.map(r=>{
    const u=userById(r.user)||{username:"former member",tier:"member"};
    const bars=PARAMS.filter(p=>(r.r[p.key]||0)>0).map(p=>`<span class="minibar">${esc(p.label.split(" ")[0])} <b>${r.r[p.key]}</b></span>`).join("");
    const roleTag=r.role==="seller"
      ? `<span class="vbadge" style="background:rgba(156,122,28,.12);color:#7a6116" title="This reviewer hired the broker to sell their business">Seller — the client</span>`
      : `<span class="vbadge" style="background:rgba(36,66,92,.1);color:var(--accent)" title="This reviewer was a buyer across the table">Buyer</span>`;
    return `<div class="rev" id="rev-${esc(r.id)}">
      <div class="revhead">${uAv(u)}<a class="un" href="#/u/${esc(u.username)}">${esc(u.username)}</a>${vBadge(u)}${roleTag}<span class="dt">${esc(r.date)}${r.stage?` · reached ${esc(r.stage)}`:""}</span></div>
      <div class="revscore"><span class="n">${fmt1(revOverall(r))}</span>${stars(revOverall(r))}</div>
      ${r.ctx?`<div class="revctx">${esc(r.ctx)}</div>`:""}
      ${r.text?`<div class="revtext">${r.ai?'<span class="ailbl">AI-structured summary of this buyer’s interview</span>':""}“${esc(r.text)}”</div>`:""}
      <div class="minibars">${bars}</div>
      <div class="revfoot">
        <button onclick="voteHelpful('${esc(r.id)}')">${helpfulVotes.has(r.id)?"✓ Helpful":"Helpful"} (${(r.helpful||0)+(helpfulVotes.has(r.id)?1:0)})</button>
        <button class="${myReports.has(r.id)?'reported':''}" onclick="openReport('${esc(r.id)}')">${myReports.has(r.id)?"⚑ Reported":"⚑ Report"}</button>
      </div>
    </div>`;
  }).join("");

  return `${nav()}
  <div class="wrap">
    <a class="back" href="#/">← Back to rankings</a>
    <section class="profile">
      ${avatar(b)}
      <div class="who">
        ${st?`<span class="rankchip r${rank<=3?rank:""}">Ranked #${rank} of ${total}</span>`:`<span class="rankchip">Not yet ranked</span>`}
        ${b.unverifiedListing?`<span class="rankchip" style="background:rgba(42,111,143,.1);color:var(--verified)">Unverified listing</span>`:""}
        <h2>${esc(b.name)}</h2>
        <div class="firm">${esc(b.firm)} · ${esc(b.city)}, ${esc(b.state)}</div>
        <div class="firm" style="margin-top:2px">Specialty: ${esc(b.specialty)}</div>
      </div>
      <div class="bigscore">
        <div class="n">${st?fmt2(st.score):"—"}<small>${st?" / 5":""}</small></div>
        <div>${stars(st?st.score:0,true)}</div>
        <div class="lbl">${st?`${st.count} review${st.count===1?"":"s"} · ${confBadge(st.conf)}`:"Awaiting first review"}</div>
      </div>
    </section>

    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${alreadyMine
        ? `<button class="btn" onclick="startReview('${esc(slug)}')">Edit your review</button>`
        : `<button class="btn" onclick="startReview('${esc(slug)}')">Write a review</button>`}
      <button class="btn ghost" onclick="toggleWatch('${esc(slug)}')">${watchlist.has(slug)?"★ Saved":"☆ Save"}</button>
      <button class="btn ghost" onclick="shareBroker('${esc(slug)}')">Share</button>
      <button class="btn ghost" onclick="toast('Prototype: broker claim flow — brokers verify identity by work email + license to respond to reviews.')">I'm this broker</button>
    </div>
    ${!alreadyMine?`<p class="note" style="margin-top:10px">Worked with ${esc(b.name)}? Rate them — it takes about 60 seconds and helps every buyer after you.</p>`:""}

    <div class="cols">
      <div class="panel"><h3>Score breakdown${st?` — weighted across ${st.count} review${st.count===1?"":"s"}`:""}</h3>${paramRows}</div>
      <div class="panel">
        <h3>At a glance</h3>
        <div class="fact"><span class="k">Global rank</span><span class="v">${st?`#${rank} of ${total}`:"—"}</span></div>
        <div class="fact"><span class="k">Reviews</span><span class="v">${st?st.count:0} (${st?st.verifiedCount:0} verified)</span></div>
        <div class="fact"><span class="k">Rating basis</span><span class="v">${st?confBadge(st.conf):"—"}</span></div>
        <div class="fact"><span class="k">Rating from buyers</span><span class="v">${st&&st.byRole.buyer?`${fmt2(st.byRole.buyer.avg)} ★ <span style="font-weight:600;color:var(--faint)">(${st.byRole.buyer.count})</span>`:"No buyer reviews yet"}</span></div>
        <div class="fact"><span class="k">Rating from sellers</span><span class="v">${st&&st.byRole.seller?`${fmt2(st.byRole.seller.avg)} ★ <span style="font-weight:600;color:var(--faint)">(${st.byRole.seller.count})</span>`:"No seller reviews yet"}</span></div>
        <div class="fact"><span class="k" title="Every review's stars added up and divided by the number of reviews. The big score above also gives extra weight to verified and recent reviews.">Average of all reviews</span><span class="v">${st?`${fmt2(st.raw)} ★`:"—"}</span></div>
        <div class="fact"><span class="k">Listing source</span><span class="v">${b.source==="curated"?"Founding reviews":b.source==="admin-added"?"Added by our team":b.source==="pilot-seed"?"Firm's public team page":"Public directory seed"}</span></div>
      </div>
    </div>

    <div class="panel" style="margin-top:22px">
      <h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">Reviews
        <span style="display:flex;gap:6px;text-transform:none;letter-spacing:0">
          ${[["all","All",revsAll.length],["buyer","From buyers",revsAll.filter(r=>r.role!=="seller").length],["seller","From sellers",revsAll.filter(r=>r.role==="seller").length]].map(([k,l,n])=>
            `<button class="qpick" style="font-size:12px;padding:5px 12px;${revFilter===k?"border-color:var(--accent);color:var(--accent);font-weight:800":""}" onclick="revFilter='${k}';render()">${l} (${n})</button>`).join("")}
        </span></h3>
      ${revCards||`<p class="note">${revFilter==="all"?`No reviews yet. Worked with ${esc(b.name)} — on either side of a deal? <b>Be the first to review.</b>`:`No ${revFilter} reviews yet — be the first from that side of the table.`}</p>`}
    </div>
    <p class="disclaimer">${DISCLAIMER}</p>
  </div>
  ${footer()}`;
}

function voteHelpful(id){
  if(!session){ openAuth(location.hash); return; }
  if(helpfulVotes.has(id)) helpfulVotes.delete(id); else helpfulVotes.add(id);
  saveState(); render();
}
function toggleWatch(slug){
  if(!session){ openAuth(location.hash); return; }
  if(watchlist.has(slug)) watchlist.delete(slug); else watchlist.add(slug);
  saveState(); render();
  toast(watchlist.has(slug)?"Saved to your watchlist":"Removed from your watchlist");
}
async function shareBroker(slug){
  const b=brokerBySlug(slug); if(!b) return;
  const url=location.href.split("#")[0]+"#/broker/"+slug;
  try{ await navigator.clipboard.writeText(url); toast(`Link copied — share ${b.name}'s page with buyers who've worked with them`); }
  catch(e){ toast("Copy this link: "+url); }
}
function openReport(id){
  if(myReports.has(id)){ toast("You already reported this review — our moderators have it."); return; }
  openModal(`
    <h3>Report this review</h3>
    <p class="note" style="margin-top:2px">Reports go to human moderators. Brokers may also respond publicly to any review about them.</p>
    <label class="fl">Reason</label>
    <select class="fi" id="repReason">
      <option>Factually inaccurate / disputed</option>
      <option>Defamatory or accusatory</option>
      <option>Not a real buyer experience</option>
      <option>Conflict of interest (competitor / fake)</option>
      <option>Reveals private information</option>
      <option>Harassment or hate</option>
      <option>Other</option>
    </select>
    <label class="fl">Details (optional)</label>
    <textarea class="fi" id="repDetail" placeholder="What specifically is wrong?"></textarea>
    <button class="btn" style="width:100%;margin-top:16px" onclick="submitReport('${esc(id)}')">Submit report</button>`);
}
function submitReport(id){
  REPORTS.unshift({ id:"m"+Math.random().toString(36).slice(2,7), type:"user-report", reviewId:id,
    reason:$("repReason").value, by:session?("@"+(me().username||"you")):"anonymous visitor",
    date:new Date().toISOString().slice(0,10), detail:$("repDetail").value||"(no details)", status:"open" });
  myReports.add(id); saveState(); closeModal(); render();
  toast("Reported — a moderator will take a look.");
}

function rvStar(key,n){ RV.ratings[key]=(RV.ratings[key]===n?0:n); render(); }   // tap the same star again to clear

/* ---------- dictate (simulated transcription) ---------- */
const DICT_SAMPLES=[
  "Pretty responsive overall, emails came back same day and the seller call was well run.",
  "The CIM was thin and it took two weeks of chasing to get real financials.",
  "Knew the business well and was straight with us about the customer concentration risk."
];
function rvDictate(){
  if(RV.recording) return;
  RV.recording=true; render();
  setTimeout(()=>{
    RV.recording=false;
    const s=DICT_SAMPLES[(RV._d=((RV._d||0)+1))%DICT_SAMPLES.length];
    RV.text=(RV.text?RV.text.trim()+" ":"")+s;
    render();
    toast("Transcribed (simulated — live speech-to-text in production)");
  },1800);
}

/* ---------- AI polish ---------- */
function rvPolish(){
  const t=(RV.text||"").trim();
  if(!t){ toast("Write or dictate a few words first — the AI edits, it doesn't invent"); return; }
  const issues=screenText(t);
  let clean=issues.length?sanitizeText(t,issues):t;
  clean=clean.replace(/\s+/g," ").trim();
  clean=clean.charAt(0).toUpperCase()+clean.slice(1);
  if(!/[.!?]$/.test(clean)) clean+=".";
  RV.text=clean; render();
  toast(issues.length?`Polished — reworded ${issues.length} flagged phrase${issues.length>1?"s":""}`:"Polished ✓");
}

/* ---------- 3-question chat helper ---------- */
const CHAT_QS=[
  q=>`What happened with ${q}? A sentence or two is plenty.`,
  ()=>"What stood out most — good or bad?",
  ()=>"Anything a future buyer should watch for? (or just say 'no')"
];
function rvChat(){
  if(RV.chatOpen){ RV.chatOpen=false; render(); return; }
  RV.chatOpen=true; RV.chatMsgs=[]; RV.chatStep=0;
  RV.chatMsgs.push({who:"ai",t:CHAT_QS[0](brokerBySlug(RV.slug).name)});
  render(); scrollChat();
}
function scrollChat(){ const c=$("chatlog"); if(c) c.scrollTop=c.scrollHeight; }
function chatSend(){
  const ta=$("chatText"); const t=(ta&&ta.value||"").trim(); if(!t) return;
  ta.value="";
  RV.chatMsgs.push({who:"me",t});
  const issues=screenText(t);
  if(issues.length){
    RV.chatMsgs.push({who:"guard",html:chatGuardHTML(issues,t)});
    render(); scrollChat(); return;
  }
  chatAccept(t);
}
function chatAccept(t){
  if(!/^no\.?$/i.test(t)) RV._answers=(RV._answers||[]).concat(t);
  RV.chatStep++;
  if(RV.chatStep<CHAT_QS.length){
    RV.chatMsgs.push({who:"typing"}); render(); scrollChat();
    setTimeout(()=>{
      RV.chatMsgs=RV.chatMsgs.filter(m=>m.who!=="typing");
      RV.chatMsgs.push({who:"ai",t:CHAT_QS[RV.chatStep]()});
      render(); scrollChat();
    },600);
  } else {
    RV.chatMsgs.push({who:"typing"}); render(); scrollChat();
    setTimeout(()=>{
      RV.chatMsgs=RV.chatMsgs.filter(m=>m.who!=="typing");
      let draft=(RV._answers||[]).join(" ").replace(/\s+/g," ").trim();
      const issues=screenText(draft);
      if(issues.length) draft=sanitizeText(draft,issues);
      if(draft){ draft=draft.charAt(0).toUpperCase()+draft.slice(1); if(!/[.!?]$/.test(draft)) draft+="."; }
      RV.text=draft; RV._answers=[]; RV.chatOpen=false;
      render();
      toast("Draft written below — edit freely, then post ✓");
    },900);
  }
}
function chatGuardHTML(issues,text){
  const clean=sanitizeText(text,issues);
  window._chatGuard={clean};
  return `<div class="guard" style="align-self:stretch">
    <h4>Wording check — let's keep this publishable</h4>
    <div class="gi">${highlightIssues(text,issues)}</div>
    <div class="gi">${issues.map(i=>`• ${esc(i.why)}`).join("<br>")}</div>
    <div class="sug"><b>Suggested wording:</b> ${esc(clean)||"<i>(describe the specific behavior instead)</i>"}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn sm" onclick="chatGuardAccept()">Use suggested wording</button>
      <button class="btn sm ghost" onclick="chatGuardDismiss()">I'll rephrase</button>
    </div>
  </div>`;
}
function chatGuardAccept(){
  RV.chatMsgs=RV.chatMsgs.filter(m=>m.who!=="guard");
  chatAccept(window._chatGuard.clean);
}
function chatGuardDismiss(){
  RV.chatMsgs=RV.chatMsgs.filter(m=>m.who!=="guard");
  render(); scrollChat();
}

/* ---------- post ---------- */
function rvPost(){
  $("rv_guard").innerHTML=""; $("rv_banner").innerHTML="";
  if(!PARAMS.some(p=>RV.ratings[p.key]>0)){
    $("rv_banner").innerHTML=`<div class="banner err">Rate at least one parameter — tap the stars on whichever ones you experienced.</div>`;
    return;
  }
  const t=(RV.text||"").trim();
  if(t){
    const issues=screenText(t);
    if(issues.length){
      $("rv_guard").innerHTML=chatGuardHTML(issues,t)
        .replace('chatGuardAccept()','rvGuardAccept()').replace('chatGuardDismiss()','rvGuardDismiss()');
      return;
    }
  }
  if(!session){ openAuth("#/review/"+RV.slug); toast("Sign in to post — your draft is saved"); return; }
  const u=me();
  if(!u.onboarded){ postAuthGo="#/review/"+RV.slug; location.hash="#/onboarding"; return; }
  if(RV.editingId){
    const ex=REVIEWS.find(x=>x.id===RV.editingId);
    if(ex){ ex.r={...RV.ratings}; ex.text=t; ex.ctx=(RV.ctx||"").slice(0,90); ex.stage=RV.stage||""; ex.role=RV.revRole||"buyer"; ex.date=new Date().toISOString().slice(0,10); ex.edited=true; }
    const mIdx=myReviews.findIndex(x=>x.id===RV.editingId);
    if(mIdx>=0) myReviews[mIdx]=ex;
    RV.done=true; saveState();
    location.hash="#/broker/"+RV.slug; toast("Review updated ✓ — rankings recalculated.");
    return;
  }
  const r={ id:"r-"+Math.random().toString(36).slice(2,8), broker:RV.slug, user:session.userId,
    date:new Date().toISOString().slice(0,10), stage:RV.stage||"", ctx:(RV.ctx||"").slice(0,90),
    r:{...RV.ratings}, text:t, ai:false, helpful:0, status:"published", role:RV.revRole||"buyer" };
  REVIEWS.push(r); myReviews.push(r); RV.done=true; saveState();
  maybePersonalTiebreak(r,()=>{ location.hash="#/broker/"+r.broker; toast("Published ✓ — rankings updated. Thanks for making the index better."); });
}
function rvGuardAccept(){ RV.text=window._chatGuard.clean; render(); setTimeout(rvPost,50); }
function rvGuardDismiss(){ $("rv_guard").innerHTML=""; }

/* ---------- personal head-to-head (orders YOUR profile list on exact ties) ---------- */
function maybePersonalTiebreak(newRev,done){
  const mine=REVIEWS.filter(r=>r.user===session.userId&&r.id!==newRev.id&&r.status==="published");
  const tied=mine.find(r=>Math.round(revOverall(r)*100)===Math.round(revOverall(newRev)*100));
  if(!tied){ done(); return; }
  const a=brokerBySlug(newRev.broker), b=brokerBySlug(tied.broker);
  if(!a||!b){ done(); return; }
  openModal(`
    <span class="eyebrow" style="margin-bottom:10px;display:inline-block">Your personal ranking</span>
    <h3>Both scored ${fmt1(revOverall(newRev))} from you</h3>
    <p class="note">One tap orders your own list — this never changes the global ranking.</p>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-top:16px;align-items:stretch">
      <button class="opt" onclick="setPTB('${esc(a.slug)}','${esc(b.slug)}','${esc(a.slug)}')"><div class="ot">${esc(a.name)}</div><div class="od">${esc(a.firm)}</div></button>
      <div style="align-self:center;font-weight:800;color:var(--faint);font-size:13px">VS</div>
      <button class="opt" onclick="setPTB('${esc(a.slug)}','${esc(b.slug)}','${esc(b.slug)}')"><div class="ot">${esc(b.name)}</div><div class="od">${esc(b.firm)}</div></button>
    </div>`,true);
  window._ptbDone=done;
}
function setPTB(a,b,winner){
  personalTB[[a,b].sort().join("|")]=winner; saveState(); closeModal();
  if(window._ptbDone){ const d=window._ptbDone; window._ptbDone=null; d(); }
}

function personalCmp(a,b){
  const d=revOverall(b.rev)-revOverall(a.rev);
  if(Math.abs(d)>0.004) return d;
  const k=[a.broker.slug,b.broker.slug].sort().join("|");
  if(personalTB[k]) return personalTB[k]===a.broker.slug?-1:1;
  return a.broker.name.localeCompare(b.broker.name);
}
function profileView(username,own){

/* ---------- bulk import: CSV / JSON / Excel → thousands of listings ---------- */
let bulkPending=null;   // staged file: {rows, dupes, invalid, fileName, mapping}

function parseCSVText(text){
  const rows=[];let row=[],cur="",inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else{ if(c==='"')inQ=true; else if(c===','){row.push(cur);cur="";}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";} else if(c!=='\r')cur+=c; } }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const BULK_ALIASES={
  name:["name","broker_name","broker","full_name","fullname","broker name","contact","agent"],
  firm:["firm","brokerage","brokerage_name","company","firm_name","office","brokerage firm"],
  city:["city","town"],
  state:["state","st","province"],
  location:["location","city_state","market","area"],
  specialty:["specialty","specialties","industry","focus","niche","sector"],
  photo:["photo","photo_url","picture","image","image_url","headshot","avatar","photo url"],
  website:["website","url","site","web","profile"],
  license:["license","license_no","license_number","lic","license #"]
};
const STATE_NAMES={alabama:"AL",alaska:"AK",arizona:"AZ",arkansas:"AR",california:"CA",colorado:"CO",connecticut:"CT",delaware:"DE",florida:"FL",georgia:"GA",hawaii:"HI",idaho:"ID",illinois:"IL",indiana:"IN",iowa:"IA",kansas:"KS",kentucky:"KY",louisiana:"LA",maine:"ME",maryland:"MD",massachusetts:"MA",michigan:"MI",minnesota:"MN",mississippi:"MS",missouri:"MO",montana:"MT",nebraska:"NE",nevada:"NV","new hampshire":"NH","new jersey":"NJ","new mexico":"NM","new york":"NY","north carolina":"NC","north dakota":"ND",ohio:"OH",oklahoma:"OK",oregon:"OR",pennsylvania:"PA","rhode island":"RI","south carolina":"SC","south dakota":"SD",tennessee:"TN",texas:"TX",utah:"UT",vermont:"VT",virginia:"VA",washington:"WA","west virginia":"WV",wisconsin:"WI",wyoming:"WY"};
function normStateVal(v){
  v=String(v||"").trim();
  if(/^[A-Za-z]{2}$/.test(v)) return v.toUpperCase();
  return STATE_NAMES[v.toLowerCase()]||"";
}
function detectMapping(headers){
  const norm=h=>String(h).trim().toLowerCase().replace(/[^a-z0-9]/g,"");
  const low=headers.map(norm);
  const m={};
  Object.entries(BULK_ALIASES).forEach(([field,aliases])=>{
    const na=aliases.map(norm);
    const i=low.findIndex(h=>na.includes(h));
    if(i>=0) m[field]={i,header:headers[i]};
  });
  return m;
}
function stageBulkTable(table,fileName){
  if(!table||table.length<2){ toast("That file has no data rows"); return; }
  const mapping=detectMapping(table[0]);
  if(!mapping.name){ toast("Couldn't find a name column — headers seen: "+table[0].slice(0,6).join(", ")); return; }
  const get=(r,f)=>mapping[f]?String(r[mapping[f].i]??"").trim():"";
  const byKey=new Map(BROKERS.map(b=>[(b.name+"|"+b.state).toLowerCase(),b]));
  const inFile=new Set();
  const rows=[], updates=[]; let identical=0, invalid=0;
  table.slice(1).forEach(r=>{
    const name=get(r,"name");
    if(!name||name.length<3){ invalid++; return; }
    let city=get(r,"city"), state=normStateVal(get(r,"state"));
    if((!city||!state)&&mapping.location){
      const parts=get(r,"location").split(",").map(x=>x.trim());
      if(!city) city=parts[0]||"";
      if(!state) state=normStateVal(parts[1]||"");
    }
    const row={ name, firm:get(r,"firm")||"Independent", city:city||"—", state:state||"—",
      specialty:get(r,"specialty")||"general SMB", photo:get(r,"photo"),
      website:get(r,"website"), license:get(r,"license") };
    const key=(name+"|"+row.state).toLowerCase();
    if(inFile.has(key)){ identical++; return; }   // duplicate within the file itself
    inFile.add(key);
    const ex=byKey.get(key);
    if(ex){
      /* same broker already listed: identical row → skip; edited row → stage an update */
      const patch={};
      if(row.firm!=="Independent"&&row.firm!==ex.firm) patch.firm=row.firm;
      if(row.city!=="—"&&row.city!==ex.city) patch.city=row.city;
      if(row.specialty!=="general SMB"&&row.specialty!==ex.specialty) patch.specialty=row.specialty;
      if(row.photo&&row.photo!==ex.photo) patch.photo=row.photo;
      if(row.website&&row.website!==(ex.website||"")) patch.website=row.website;
      if(Object.keys(patch).length) updates.push({slug:ex.slug,name:ex.name,patch});
      else identical++;
      return;
    }
    rows.push(row);
  });
  bulkPending={rows,updates,identical,invalid,fileName,mapping};
  render();
}
function stageBulkObjects(arr,fileName){
  if(!Array.isArray(arr)){ toast("Expected a JSON array of broker objects"); return; }
  const heads=[...new Set(arr.flatMap(o=>Object.keys(o)))];
  stageBulkTable([heads,...arr.map(o=>heads.map(h=>o[h]??""))],fileName);
}
function bulkFileChosen(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const done=()=>{ inp.value=""; };
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  if(ext==="xlsx"||ext==="xls"){
    loadSheetJS(()=>{
      const rd=new FileReader();
      rd.onload=()=>{ try{
        const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const table=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""}).map(r=>r.map(c=>String(c)));
        stageBulkTable(table,f.name);
      }catch(e){ toast("Couldn't read that Excel file: "+e.message); } finally{ done(); } };
      rd.readAsArrayBuffer(f);
    });
    return;
  }
  const rd=new FileReader();
  rd.onload=()=>{ try{
    if(ext==="json") stageBulkObjects(JSON.parse(rd.result),f.name);
    else stageBulkTable(parseCSVText(String(rd.result)),f.name);
  }catch(e){ toast("Couldn't read that file: "+e.message); } finally{ done(); } };
  rd.readAsText(f);
}
function loadSheetJS(cb){
  if(window.XLSX){ cb(); return; }
  toast("Loading Excel reader…");
  const sc=document.createElement("script");
  sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  sc.onload=cb;
  sc.onerror=()=>toast("Excel reader unavailable here — save the sheet as CSV and upload that instead");
  document.head.appendChild(sc);
}
function commitBulk(){
  if(!bulkPending||(!bulkPending.rows.length&&!bulkPending.updates.length)) return;
  const t0=Date.now();
  const batch=bulkPending.fileName.replace(/\s*\(.*\)$/,"")+" · "+new Date().toISOString().slice(0,16).replace("T"," ");
  const slugSet=new Set(BROKERS.map(b=>b.slug));       // O(1) uniqueness at 10k+ scale
  bulkPending.rows.forEach(r=>{
    let base=r.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"broker";
    let slug=base, i=2;
    while(slugSet.has(slug)) slug=base+"-"+(i++);
    slugSet.add(slug);
    const b={ slug, name:r.name, firm:r.firm, city:r.city, state:r.state, specialty:r.specialty,
      photo:r.photo||"", website:r.website||"", license:r.license||"",
      source:"bulk-import", batch, claimed:false, unverifiedListing:false };
    BROKERS.push(b); bulkAdded.push(b);
  });
  bulkPending.updates.forEach(u=>{
    const b=brokerBySlug(u.slug); if(!b) return;
    Object.assign(b,u.patch);
    if(!bulkAdded.some(x=>x.slug===u.slug))            // persist edits to seed brokers
      brokerEdits[u.slug]={...(brokerEdits[u.slug]||{}),...u.patch};
  });
  const n=bulkPending.rows.length, m=bulkPending.updates.length;
  bulkPending=null; saveState(); listPage=0; render();
  const kept=(()=>{try{return (JSON.parse(localStorage.getItem("bi_proto")||"{}").bulkAdded||[]).length>=bulkAdded.length;}catch(e){return false;}})();
  toast(`${n?`Imported ${n.toLocaleString()} new`:""}${n&&m?", ":""}${m?`updated ${m.toLocaleString()} existing`:""} in ${((Date.now()-t0)/1000).toFixed(1)}s${kept?"":" — too large for browser storage; lasts until refresh in the prototype (production saves to the database)"}`);
}
/* ---------- imported batches: list + undo ---------- */
function importBatches(){
  const map=new Map();
  bulkAdded.forEach(b=>{ const k=b.batch||"earlier imports"; map.set(k,(map.get(k)||0)+1); });
  return [...map.entries()];
}
function adminRemoveBatch(batch){
  const slugs=new Set(bulkAdded.filter(b=>(b.batch||"earlier imports")===batch).map(b=>b.slug));
  if(!slugs.size) return;
  if(!confirm(`Remove all ${slugs.size.toLocaleString()} brokers imported in “${batch}” (and any reviews on them)?`)) return;
  BROKERS=BROKERS.filter(b=>!slugs.has(b.slug));
  bulkAdded=bulkAdded.filter(b=>!slugs.has(b.slug));
  REVIEWS=REVIEWS.filter(r=>!slugs.has(r.broker));
  myReviews=myReviews.filter(r=>!slugs.has(r.broker));
  saveState(); render(); toast(`Removed ${slugs.size.toLocaleString()} brokers — import undone`);
}

function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
async function saveCSV(filename,rows){
  const data=rows.map(r=>r.map(csvCell).join(",")).join("\n")+"\n";
  try{
    const dls=window.claude&&window.claude.use?await claude.use("downloads"):null;
    if(dls){ await dls.save({filename,data}); toast("Exported "+filename+" ✓"); return; }
  }catch(e){ if(e&&e.code==="declined") return; }
  try{ await navigator.clipboard.writeText(data); toast("Saving unavailable here — CSV copied to clipboard instead"); }
  catch(e){ toast("Export unavailable in this view"); }
}

/* built-in demo file so the flow can be tried without preparing a spreadsheet */
function bulkSample(){
  const r=mulberry32(424242);   // deterministic: re-running the sample yields the SAME brokers, so dedupe catches them
  const p=a=>a[Math.floor(r()*a.length)];
  const table=[["Broker Name","Brokerage","City","State","Specialty","Photo URL"]];
  const seen=new Set();
  while(table.length<10001){
    const name=p(FIRST)+" "+p(LAST)+" "+"ABCDEFGHJKLMNPRSTW"[Math.floor(r()*18)]+".";
    if(seen.has(name)) continue; seen.add(name);
    const st=p(STATES);
    table.push([name,p(FIRM_A)+" "+p(FIRM_B),p(CITY[st]),st,p(SPECIALTIES),""]);
  }
  stageBulkTable(table,"sample-brokers.csv");
}

function adminAddBroker(){
  const name=($("ab_name").value||"").trim();
  if(!name){ $("ab_banner").innerHTML=`<div class="banner err">Name is required.</div>`; return; }
  if(BROKERS.some(b=>b.name.toLowerCase()===name.toLowerCase())){ $("ab_banner").innerHTML=`<div class="banner err">Already listed.</div>`; return; }
  let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-"); let i=2; while(brokerBySlug(slug)) slug=slug+"-"+(i++);
  const b={ slug, name, firm:($("ab_firm").value||"Independent").trim(), city:($("ab_city").value||"—").trim(),
    state:$("ab_state").value, specialty:($("ab_spec").value||"general SMB").trim(),
    photo:"", source:"admin-added", claimed:false, unverifiedListing:false };
  BROKERS.unshift(b); addedBrokers.push(b); saveState(); render();
  toast(`Added ${name} ✓`);
}
function adminRemoveBroker(slug){
  const b=brokerBySlug(slug); if(!b) return;
  const n=reviewsFor(slug).length;
  if(!confirm(`Remove ${b.name}${n?` and their ${n} review${n===1?"":"s"}`:""}? (Production archives to the audit log.)`)) return;
  BROKERS=BROKERS.filter(x=>x.slug!==slug);
  REVIEWS=REVIEWS.filter(r=>r.broker!==slug);
  addedBrokers=addedBrokers.filter(x=>x.slug!==slug);
  myReviews=myReviews.filter(r=>r.broker!==slug);
  saveState(); render(); toast(`${b.name} removed`);
}
function adminDeleteReview(id){
  const r=REVIEWS.find(x=>x.id===id); if(!r) return;
  if(!confirm("Delete this review? The author is notified; rankings recompute. (Logged in production.)")) return;
  r.status="removed"; saveState(); render(); toast("Review deleted — rankings updated");
}
function adminApproveSug(id){
  const s=suggestions.find(x=>x.id===id); if(!s) return;
  const loc=(s.loc||"").split(",").map(x=>x.trim());
  let slug=s.name.toLowerCase().replace(/[^a-z0-9]+/g,"-"); let i=2; while(brokerBySlug(slug)) slug=slug+"-"+(i++);
  BROKERS.unshift({ slug, name:s.name, firm:s.firm||"Independent", city:loc[0]||"—",
    state:(loc[1]||"TX").toUpperCase().slice(0,2), specialty:"general SMB",
    photo:"", source:"admin-added", claimed:false, unverifiedListing:false });
  s.status="approved"; saveState(); render(); toast(`${s.name} listed ✓ — requester notified`);
}
function adminDismissSug(id){
  const s=suggestions.find(x=>x.id===id); if(!s) return;
  s.status="dismissed"; saveState(); render(); toast("Request dismissed");
}

function saveBrokerEdit(slug){
  const b=brokerBySlug(slug); if(!b) return;
  const name=($("be_name").value||"").trim();
  if(!name){ toast("Name can't be empty"); return; }
  const pinRaw=($("be_pin")&&$("be_pin").value||"").trim();
  const pin=pinRaw?Math.max(1,parseInt(pinRaw,10)||0):null;
  const patch={ name, firm:($("be_firm").value||"").trim()||"Independent",
    city:($("be_city").value||"").trim()||"—", state:(($("be_state").value||"").trim()||"—").toUpperCase(),
    specialty:($("be_spec").value||"").trim()||"general SMB",
    photo:($("be_photo").value||"").trim(), website:($("be_web").value||"").trim() };
  if(pin) patch.rankPin=pin; else delete b.rankPin;
  Object.assign(b,patch);
  brokerEdits[slug]={...(pin?patch:{...patch})};
  if(!pin) brokerEdits[slug].rankPin=undefined;
  saveState(); closeModal(); render();
  toast(pin?`Saved — ${name} pinned at #${pin} (manual override)`:`Saved — ${name} updated`);
}
function modAct(repId,action){
  const rep=REPORTS.find(r=>r.id===repId); if(!rep) return;
  rep.status=action;
  if(action==="removed"){ const rev=REVIEWS.find(r=>r.id===rep.reviewId); if(rev) rev.status="removed"; }
  saveState(); render();
  toast({dismissed:"Report dismissed — review stays up.",edited:"Author asked to edit (simulated notification).",removed:"Review deleted; author and broker notified."}[action]||"Done");
}

function methodologyView(){
  const sections=PARAMS.map(p=>`<h3>${esc(p.label)}</h3><p class="pdef">${esc(p.short)}</p>`).join("");
  return `${nav('meth')}
  <div class="wrap">
    <header class="hero" style="padding-bottom:20px"><span class="eyebrow">Methodology</span>
      <h1 class="title" style="font-size:clamp(32px,6vw,46px)">How the ranking works</h1></header>
    <div class="prose">
      <p class="lead">The Broker Index began as one buy-side team documenting hundreds of broker interactions. It's now a community index: any verified buyer can review any broker they've genuinely dealt with, and every broker's rank is computed from all of it — openly, by the method below.</p>
      <h2>Who can review</h2>
      <p>Reviews come from registered buyers AND sellers — buyers rate brokers they faced across the table; sellers rate the broker who represented them, and every broker page shows both perspectives separately. Members who verify real deal activity — a broker NDA, CIM access, an LOI, or an SBA pre-qualification — earn the <b>✓ Verified buyer</b> badge. Reviewers are pseudonymous in public and accountable in private: we know who they are; brokers and readers see only the username.</p>
      <h2>The six parameters</h2>${sections}
      <h2>From ratings to rank</h2>
      <div class="scorebox">
        <b>1 · Review score.</b> Reviewers rate only the parameters they experienced — one is enough — and a review's overall is the average of what they rated.<br><br>
        <b>2 · Weight.</b> Reviews aren't equal: verified buyers count at full weight, unverified members at roughly half; every review's influence also decays gently with age (half-life ≈ 18 months), so a broker's rating reflects how they work <i>now</i>.<br><br>
        <b>3 · Confidence-adjusted score.</b> A broker's weighted average is pulled toward the site-wide mean until they accumulate evidence (a Bayesian prior of ~2.5 reviews' weight). One glowing review can't mint a #1 broker, and one hostile review can't sink an established one.<br><br>
        <b>4 · Order.</b> Brokers rank by that score at two decimals; residual ties break by total review weight, then review count — evidence, not coin flips. Ratings are labeled <i>Provisional → Early → Established</i> as evidence accumulates.
      </div>
      <h2>Integrity</h2>
      <p>Every submission is screened by an AI guardrail for defamation-style accusations, profanity, personal information, and off-topic attacks — reviewers are shown the issue and offered a factual rewording; nothing publishes without the author's approval. Human moderators handle reports and disputes, and brokers can claim their profile and respond publicly to any review. Astroturfing (fake or coordinated reviews, competitors reviewing rivals, review-for-pay) is a permanent ban.</p>
      <p class="disclaimer" style="margin-top:16px"><b>Disclaimer:</b> ${DISCLAIMER}</p>
    </div>
  </div>${footer()}`;
}
