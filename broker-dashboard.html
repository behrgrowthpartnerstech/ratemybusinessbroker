<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage your broker page | The Broker Index</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_shared.css">
</head>
<body data-nav="account">
<div id="site-header"></div>
<main class="wrap app" id="main" style="padding-top:28px"><div class="skel"></div></main>
<div id="site-footer"></div>
<div id="modals"></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/_shell.js"></script>
<script src="/_app.js"></script>
<script>
const $=TBI.$, esc=TBI.esc, sb=TBI.sb;
let B=null, listings=[], inquiries={};
const STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

function scorePanel(){
  const sc=TBI.scores[B.id], full=TBI.shown(sc), s=TBI.shownSide(sc,'seller'), u=TBI.shownSide(sc,'buyer');
  const box=(lab,x,who)=>`<div class="scorebox"><div class="lab">${lab}</div>${x?`<div class="big${who==='buy'?' gold':''}" style="font-size:36px">${TBI.fmt(x.score)}<small>/10</small></div><div class="n">${x.count} review${x.count===1?'':'s'}</div>`:`<div class="big" style="font-size:18px;color:var(--mut)">Not yet rated</div>`}</div>`;
  const weakest = full ? TBI.PARAMS.map(p=>({l:p[1],v:full.params[p[0]]})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v)[0] : null;
  return `<div class="panel navy"><div class="sechead"><div><h2>How clients rate you</h2><p class="sub">Read-only. Reviews and scores can't be edited by anyone, including us — that's what makes the Verified mark worth having.</p></div><a class="btn linelt sm" href="/broker-${esc(B.slug)}.html">View public page</a></div>
    <div class="cols3" style="margin-top:12px">${box('Overall',full)}${box('Rated by sellers',s)}${box('Rated by buyers',u,'buy')}</div>
    ${weakest?`<p class="sub" style="margin-top:12px">Lowest parameter: <b style="color:#fff">${weakest.l.toLowerCase()}</b> at ${TBI.fmt(weakest.v)}. ${full.trend!=null?'Six-month trend '+(full.trend>0?'▲ +':'▼ ')+TBI.fmt(Math.abs(full.trend))+'.':''}</p>`:`<p class="sub" style="margin-top:12px">Share your page with past clients — all of them, not just the happy ones. Verified-client reviews carry about double weight.</p>`}</div>`;
}

function detailsPanel(){
  const specs = TBI.specsOf(B).join(' | ');
  return `<div class="panel"><div class="sechead"><div><h2>Your details</h2><p class="sub">Shown on your public page. Changes are live immediately; the static page picks them up on the next rebuild (daily).</p></div></div>
    <form onsubmit="event.preventDefault();saveDetails()">
    <div class="cols2" style="grid-template-columns:1fr 1fr;gap:12px">
      <div><label class="fl" for="d-name" style="margin-top:8px">Name</label><input class="fi" id="d-name" maxlength="80" value="${esc(B.name)}"></div>
      <div><label class="fl" for="d-firm" style="margin-top:8px">Brokerage</label><input class="fi" id="d-firm" maxlength="80" value="${esc(B.firm)}"></div>
      <div><label class="fl" for="d-city">City</label><input class="fi" id="d-city" maxlength="60" value="${esc(B.city==='—'?'':B.city)}"></div>
      <div><label class="fl" for="d-state">State</label><select class="fi" id="d-state"><option value="—">—</option>${STATES.map(s=>`<option ${B.state===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label class="fl" for="d-web">Website</label><input class="fi" id="d-web" maxlength="200" placeholder="https://" value="${esc(B.website||'')}"></div>
      <div><label class="fl" for="d-li">LinkedIn</label><input class="fi" id="d-li" maxlength="200" placeholder="https://linkedin.com/in/…" value="${esc(B.linkedin||'')}"></div>
      <div><label class="fl" for="d-phone">Phone</label><input class="fi" id="d-phone" maxlength="30" value="${esc(B.phone||'')}"></div>
      <div><label class="fl" for="d-photo">Photo URL</label><input class="fi" id="d-photo" maxlength="300" placeholder="https://…/headshot.jpg" value="${esc(B.photo||'')}"></div>
    </div>
    <label class="fl" for="d-spec">Specialties <span class="hint" style="display:inline">(separate with |, e.g. Manufacturing | Healthcare | $2M–$10M deals)</span></label><input class="fi" id="d-spec" maxlength="200" value="${esc(specs)}">
    <label class="fl" for="d-bio">About you</label><textarea class="fi" id="d-bio" maxlength="1200" style="min-height:110px" placeholder="Who you work with, what you specialise in, how long you've been brokering. Plain facts read better than sales copy here.">${esc(B.bio||'')}</textarea>
    <div class="msg" id="d-msg"></div>
    <div style="margin-top:14px"><button class="btn navy" type="submit">Save details</button></div></form></div>`;
}
async function saveDetails(){
  const m=$('#d-msg'); const row={ name:$('#d-name').value.trim(), firm:$('#d-firm').value.trim()||'Independent', city:$('#d-city').value.trim()||'—', state:$('#d-state').value, website:$('#d-web').value.trim(), linkedin:$('#d-li').value.trim(), phone:$('#d-phone').value.trim(), photo:$('#d-photo').value.trim(), specialty:$('#d-spec').value.trim()||'general SMB', bio:$('#d-bio').value.trim() };
  const r=await sb.from('brokers').update(row).eq('id',B.id);
  if(r.error){ m.className='msg err'; m.textContent=r.error.message; return; }
  Object.assign(B,row); m.className='msg ok'; m.textContent='Saved.'; TBI.toast('Details saved');
}

function listingsPanel(){
  const active=listings.filter(l=>l.status==='active'), inactive=listings.filter(l=>l.status!=='active');
  const row=l=>`<div class="rrow" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="nm">${esc(l.title)} ${l.status!=='active'?'<span class="pendtag">inactive</span>':''}</div><div class="mt">${esc([l.industry,l.state,l.price_label].filter(Boolean).join(' · '))}${inquiries[l.id]?' · <b>'+inquiries[l.id]+' inquir'+(inquiries[l.id]===1?'y':'ies')+'</b>':''}</div>${l.summary?`<div class="mt" style="margin-top:4px;color:var(--ink2)">${esc(l.summary)}</div>`:''}</div>
    <div style="display:flex;gap:6px;flex-shrink:0"><button class="btn line sm" onclick="editListing('${l.id}')">Edit</button><button class="btn line sm" onclick="toggleListing('${l.id}','${l.status==='active'?'inactive':'active'}')">${l.status==='active'?'Deactivate':'Activate'}</button><button class="x" title="Delete" onclick="delListing('${l.id}')">✕</button></div></div>`;
  return `<div class="panel"><div class="sechead"><div><h2>Your listings</h2><p class="sub">Businesses you currently represent. Up to 5 active, shown in a compact section at the bottom of your page. Buyers can send you an inquiry from there.</p></div><button class="btn line sm" ${active.length>=5?'disabled title="5 active max — deactivate one first"':''} onclick="editListing()">＋ Add listing</button></div>
    ${listings.length?`<div class="rlist">${active.map(row).join('')}${inactive.map(row).join('')}</div>`:'<p class="hint">No listings yet. Listings are optional — your rating is what most visitors come for.</p>'}</div>`;
}
function editListing(id){
  const l = id ? listings.find(x=>x.id===id) : { title:'', industry:'', state:B.state==='—'?'':B.state, price_label:'Inquire for price', summary:'', url:'', contact_email:'' };
  TBI.modal(`<div class="mhead"><h3>${id?'Edit':'New'} listing</h3><button class="x" onclick="TBI.closeModal()">✕</button></div><div class="mbody">
    <label class="fl" for="l-title" style="margin-top:0">Title <span class="req">*</span></label><input class="fi" id="l-title" maxlength="90" placeholder="e.g. Commercial HVAC contractor, Denver metro" value="${esc(l.title)}">
    <div class="cols3"><div><label class="fl" for="l-ind">Industry</label><input class="fi" id="l-ind" maxlength="40" value="${esc(l.industry)}"></div><div><label class="fl" for="l-state">State</label><input class="fi" id="l-state" maxlength="30" value="${esc(l.state)}"></div><div><label class="fl" for="l-price">Price</label><input class="fi" id="l-price" maxlength="40" value="${esc(l.price_label)}"></div></div>
    <label class="fl" for="l-sum">One-paragraph summary <span class="hint" style="display:inline">(max 240 chars, no identifying details)</span></label><textarea class="fi" id="l-sum" maxlength="240" style="min-height:80px">${esc(l.summary)}</textarea>
    <div class="cols2" style="grid-template-columns:1fr 1fr;gap:12px"><div><label class="fl" for="l-url">Link to full listing</label><input class="fi" id="l-url" maxlength="300" placeholder="https://" value="${esc(l.url)}"></div><div><label class="fl" for="l-email">Inquiry email <span class="req">*</span></label><input class="fi" id="l-email" maxlength="120" type="email" value="${esc(l.contact_email||'')}"></div></div>
    <div class="msg" id="l-msg"></div><div style="margin-top:14px"><button class="btn navy wide" onclick="saveListing(${id?`'${id}'`:'null'})">Save listing</button></div></div>`);
}
async function saveListing(id){
  const m=$('#l-msg'); const row={ broker_id:B.id, title:$('#l-title').value.trim(), industry:$('#l-ind').value.trim(), state:$('#l-state').value.trim(), price_label:$('#l-price').value.trim()||'Inquire for price', summary:$('#l-sum').value.trim(), url:$('#l-url').value.trim(), contact_email:$('#l-email').value.trim() };
  if(!row.title||!row.contact_email){ m.className='msg err'; m.textContent='Title and inquiry email are required.'; return; }
  const r = id ? await sb.from('listings').update(row).eq('id',id) : await sb.from('listings').insert(row);
  if(r.error){ m.className='msg err'; m.textContent=r.error.message; return; }
  TBI.closeModal(); TBI.toast('Listing saved'); await loadListings(); paint();
}
async function toggleListing(id,status){ const r=await sb.from('listings').update({status}).eq('id',id); if(r.error) return TBI.toast(r.error.message); await loadListings(); paint(); }
async function delListing(id){ if(!confirm('Delete this listing?')) return; await sb.from('listings').delete().eq('id',id); await loadListings(); paint(); }
async function loadListings(){ const r=await sb.from('listings').select('*').eq('broker_id',B.id).order('created_at'); listings=r.data||[]; const q=await sb.from('listing_inquiries').select('listing_id'); inquiries={}; (q.data||[]).forEach(x=>inquiries[x.listing_id]=(inquiries[x.listing_id]||0)+1); }

function paint(){ $('#main').innerHTML = `<div class="pagehead" style="padding-top:0"><div class="eyebrow">Broker dashboard</div><h1>${esc(B.name)}</h1><p class="sub">${esc(B.firm)} · <span class="vpill">✓ Verified</span></p></div>
  ${scorePanel()}<div class="cols2b" style="margin-top:16px;grid-template-columns:1fr 1fr"><div>${detailsPanel()}</div><div>${listingsPanel()}<div class="panel" style="margin-top:16px"><h3 style="font-family:Inter;font-size:15px">Monthly report</h3><p class="sub">On the 1st of each month we email you how clients rated you, with trends, when anything changed. <a href="/account.html?digest=off">Turn off</a>.</p></div></div></div>`; }

(async()=>{
  await TBI.ready;
  if(!TBI.user){ $('#main').innerHTML='<div class="panel" style="max-width:520px;margin:30px auto;text-align:center"><h2>Broker dashboard</h2><p class="sub" style="margin:10px 0 18px">Sign in with the account you used to claim your page.</p><button class="btn gold" onclick="TBI.openAuth()">Sign in</button></div>'; TBI.onAuth(u=>{ if(u) location.reload(); }); return; }
  await TBI.load();
  const mine = TBI.brokers.filter(b=>b.claimed_by===TBI.user.id);
  if(!mine.length){ $('#main').innerHTML='<div class="panel" style="max-width:560px;margin:30px auto"><h2>No claimed page on this account</h2><p class="sub" style="margin-top:8px">If you’ve submitted a claim, we’re still verifying it — you’ll get a notification on your account page when it’s approved. Otherwise, <a href="/claim.html">claim your page here</a>.</p></div>'; return; }
  const want = TBI.qs('b'); B = (want && mine.find(b=>b.slug===want)) || mine[0];
  if (mine.length>1) { /* firm owner with several agents */ }
  await loadListings(); paint();
  if (mine.length>1) $('#main').insertAdjacentHTML('afterbegin', `<div class="notice blue" style="margin-bottom:14px"><span>You manage ${mine.length} pages: ${mine.map(b=>`<a href="?b=${esc(b.slug)}"><b>${esc(b.name)}</b></a>`).join(' · ')}</span></div>`);
})();
</script>
</body>
</html>
