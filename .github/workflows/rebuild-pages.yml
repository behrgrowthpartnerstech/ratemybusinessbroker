name: Rebuild broker pages
# Regenerates broker profile pages, state pages, and sitemap.xml from the live
# Supabase broker list. Runs every Monday and whenever you press "Run workflow".
on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages from Supabase
        run: python3 generate_pages.py --from-supabase
      - name: Commit and push if anything changed
        run: |
          git config user.name "broker-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Auto-rebuild broker & state pages from live directory"
          git push
