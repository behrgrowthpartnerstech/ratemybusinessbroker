# Rebuild broker & state pages from the live Supabase directory.
# Runs every day at 09:00 UTC (3 AM Denver), and any time you press "Run workflow".
name: Rebuild broker pages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pages from Supabase
        run: python3 generate_pages.py --from-supabase
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || (git commit -m "Auto-rebuild broker & state pages from live directory" && git push)
