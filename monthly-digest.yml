# Monthly feedback email to brokers who have claimed their profile.
# Runs on the 1st of each month at 14:00 UTC, or manually from the Actions tab.
# Secrets to add (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_KEY  (Supabase → Project settings → API → service_role)
#   RESEND_API_KEY        (resend.com)
#   DIGEST_FROM           e.g. "The Broker Index <reports@ratemybusinessbroker.com>"
name: Monthly broker digest
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Send to one broker only (slug), for testing'
        required: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/monthly-broker-digest.js
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          ONLY_SLUG: ${{ github.event.inputs.slug }}
